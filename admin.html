<script>
/* ---------------- Shared menu ----------------
   The only editable menu lives in Firestore at settings/menu and is changed from
   the owner dashboard Settings page. This retired dashboard reads that record; it
   intentionally has no second hardcoded menu to keep in sync. */
let MENU = {};
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const COMMISSION_RATE = 0.30;
const SQUARE_REAL_RATE = 0.026;
const SQUARE_REAL_FLAT = 0.10;

function weekdayOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(y,m-1,d).getDay()];
}
function effectiveWeekday(day){ return day.menuOverride || weekdayOf(day.date); }
function livePriceOf(name, weekday){
  const menu = MENU[weekday];
  if(!menu) return 0;
  const f = Object.values(menu).flat().find(x=>x[0]===name);
  return f ? f[1] : 0;
}
function fmtMoney(n){ return '$'+(Math.round((n||0)*100)/100).toFixed(2); }

// ---- Pure per-day calculations, mirroring index.html exactly ----
// Sold-item revenue always uses the price snapshot stored on the sale at
// the time it happened (it.price) — never re-derived from the live MENU above.
function stopRevenue(stop){
  let total = 0;
  Object.values(stop.items||{}).forEach(it=>{ total += (it.sold||0) * (it.price!=null ? it.price : 0); });
  return total;
}
function dayRevenue(day){ return Object.values(day.stops||{}).reduce((s,st)=>s+stopRevenue(st),0); }
function dayItemsSold(day){
  const totals = {};
  Object.values(day.stops||{}).forEach(st=>{
    Object.entries(st.items||{}).forEach(([name,v])=>{ totals[name] = (totals[name]||0) + (v.sold||0); });
  });
  return totals;
}
function dayReturnedValue(day){
  const wd = effectiveWeekday(day);
  let count = 0, value = 0;
  Object.entries(day.returns||{}).forEach(([name,qty])=>{ count += qty; value += qty * livePriceOf(name, wd); });
  return { count, value };
}
function stopCollectedTotal(stop){ return (stop.payments||[]).reduce((s,p)=>s+(p.amount-(p.fee||0)),0); }
function dayFeesTotal(day){ return Object.values(day.stops||{}).reduce((t,st)=>t+(st.payments||[]).reduce((s,p)=>s+(p.fee||0),0),0); }
function dayRealSquareFee(day){
  let t = 0;
  Object.values(day.stops||{}).forEach(st=>{
    (st.payments||[]).forEach(p=>{ if(p.method==='Square') t += p.amount*SQUARE_REAL_RATE + SQUARE_REAL_FLAT; });
  });
  return t;
}
function dayPaymentTotals(day){
  const t = { Square:0, Zelle:0, Venmo:0, 'Credit Card':0, Cash:0, Owed:0 };
  Object.values(day.stops||{}).forEach(st=>{
    (st.payments||[]).forEach(p=>{ if(t[p.method]!==undefined) t[p.method]+=p.amount; });
  });
  return t;
}
function dayCashMoves(day){
  let topups=0, changeGiven=0;
  Object.values(day.stops||{}).forEach(st=>{
    (st.cashMoves||[]).forEach(c=>{ if(c.type==='topup') topups+=c.amount; else if(c.type==='change') changeGiven+=c.amount; });
  });
  return { topups, changeGiven };
}

// ---- Firebase ----
let fbDb;
function initFirebase(){
  firebase.initializeApp(FIREBASE_CONFIG);
  fbDb = firebase.firestore();
}

function isManagedMenu(value){
  return value && typeof value === 'object'
    && ['Monday','Tuesday','Wednesday','Thursday','Friday'].every(day=>value[day] && typeof value[day] === 'object');
}

async function loadSharedMenu(){
  MENU = {};
  const menuSnap = await fbDb.collection('settings').doc('menu').get();
  const managed = menuSnap.exists && menuSnap.data().weeklyMenu;
  if(!isManagedMenu(managed)) throw new Error('The shared menu is not ready yet. Open the owner dashboard Settings page and save the menu once.');
  MENU = managed;
}

async function loadAllDriverData(){
  let labels = {};
  try{
    const labelsSnap = await fbDb.collection('settings').doc('driverDirectory').get();
    labels = (labelsSnap.exists && labelsSnap.data().labels) || {};
  }catch(e){}
  const driversSnap = await fbDb.collection('drivers').get();
  const drivers = [];
  for(const doc of driversSnap.docs){
    const info = doc.data();
    const daysSnap = await doc.ref.collection('days').get();
    drivers.push({ driverId: doc.id, name: labels[doc.id] || info.name || doc.id, days: daysSnap.docs.map(d=>d.data()) });
  }
  return drivers;
}

    noData:'Không có thông tin tài xế trong thời gian này.',loading:'Đang tải thông tin kinh doanh…',
    updated:'Cập nhật lần cuối',loginTitle:'Đăng nhập chủ doanh nghiệp',loginIntro:'Xem doanh thu, tài xế, tiền mặt và hàng trả ở một nơi.',
    email:'Email',password:'Mật khẩu',signin:'Đăng nhập',loginHint:'Trang này riêng tư. Chỉ chủ GreenLife có thể đăng nhập.'
  }
};
let currentLanguage = localStorage.getItem('greenlife-admin-language') || 'en';
let currentDrivers = [];
let autoRefreshTimer;
function t(key){ return (TEXT[currentLanguage]&&TEXT[currentLanguage][key]) || TEXT.en[key] || key; }
function initials(name){ return String(name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase(); }
function selectedRange(){ return document.getElementById('rangeFilter').value; }
function rangeStart(range){
  const now = new Date(), d = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(range==='today') return d;
  if(range==='week'){ d.setDate(d.getDate()-((d.getDay()+6)%7)); return d; }
  if(range==='month') return new Date(now.getFullYear(),now.getMonth(),1);
  return null;
}
function filterDrivers(drivers){
  const start = rangeStart(selectedRange());
  if(!start) return drivers.map(d=>({...d,days:[...d.days]}));
  const startKey = start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
  return drivers.map(d=>({...d,days:d.days.filter(day=>day.date>=startKey)}));
}
function formatDay(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  return new Intl.DateTimeFormat(currentLanguage==='vi'?'vi-VN':'en-US',{month:'short',day:'numeric'}).format(new Date(y,m-1,d));
}
function applyLanguage(){
  document.documentElement.lang=currentLanguage;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  document.getElementById('welcomeText').textContent=t('welcome');
  document.getElementById('refreshNote').textContent=t('autoRefresh');
  const options=document.getElementById('rangeFilter').options;
  ['today','week','month','all'].forEach((key,i)=>{ options[i].textContent=t(key); });
  document.getElementById('langEn').classList.toggle('active',currentLanguage==='en');
  document.getElementById('langVi').classList.toggle('active',currentLanguage==='vi');
  if(currentDrivers.length) renderDashboard(currentDrivers);
}

function renderDashboard(allDrivers){
  const content = document.getElementById('content');
  const drivers = filterDrivers(allDrivers);
  const totalDays = drivers.reduce((s,d)=>s+d.days.length,0);
  if(totalDays===0){ content.innerHTML='<div class="card"><div class="empty">'+t('noData')+'</div></div>'; return; }
  let totalRevenue=0,totalRealFee=0,totalWasteValue=0,totalWasteCount=0,totalOwed=0,totalCash=0,totalItems=0;
  const soldAgg={},daily={};
  const perDriver=drivers.map(drv=>{
    let rev=0,wasteVal=0,wasteCount=0,itemsSold=0,cashSales=0,topups=0,changeGiven=0,owed=0;
    drv.days.forEach(day=>{
      const r=dayRevenue(day); rev+=r; totalRevenue+=r; daily[day.date]=(daily[day.date]||0)+r;
      totalRealFee+=dayRealSquareFee(day);
      const waste=dayReturnedValue(day); wasteVal+=waste.value;wasteCount+=waste.count;totalWasteValue+=waste.value;totalWasteCount+=waste.count;
      const sold=dayItemsSold(day);Object.entries(sold).forEach(([k,v])=>{soldAgg[k]=(soldAgg[k]||0)+v;itemsSold+=v;totalItems+=v;});
      const pay=dayPaymentTotals(day);cashSales+=pay.Cash;owed+=pay.Owed;totalOwed+=pay.Owed;
      const moves=dayCashMoves(day);topups+=moves.topups;changeGiven+=moves.changeGiven;
    });
    const netCash=cashSales+topups-changeGiven;totalCash+=netCash;
    return{name:drv.name,days:drv.days.length,rev,commission:rev*COMMISSION_RATE,itemsSold,wasteVal,wasteCount,cashSales,topups,changeGiven,netCash,owed};
  }).sort((a,b)=>b.rev-a.rev);
  const totalCommission=totalRevenue*COMMISSION_RATE;
  const bestSellers=Object.entries(soldAgg).sort((a,b)=>b[1]-a[1]).slice(0,7);
  const dailyRows=Object.entries(daily).sort((a,b)=>a[0].localeCompare(b[0])).slice(-10);
  const maxDaily=Math.max(...dailyRows.map(x=>x[1]),1),maxSeller=Math.max(...bestSellers.map(x=>x[1]),1);
  const alerts=[];
  if(totalOwed>0) alerts.push(alertHtml('danger','! ',t('owedAlert'),t('owedAlertHelp').replace('{amount}',fmtMoney(totalOwed))));
  if(totalWasteCount>0) alerts.push(alertHtml('warning','↩',t('returnsAlert'),t('returnsAlertHelp').replace('{count}',totalWasteCount).replace('{amount}',fmtMoney(totalWasteValue))));
  if(!alerts.length) alerts.push(alertHtml('','✓',t('noProblems'),t('noProblemsHelp')));
  content.innerHTML=
    '<section class="summary-grid">'+metricHtml('↗',t('revenue'),fmtMoney(totalRevenue),totalItems+' '+t('sold'))+metricHtml('♟',t('commission'),fmtMoney(totalCommission),t('paidDrivers'))+metricHtml('$',t('cashExpected'),fmtMoney(totalCash),t('cashHelp'),'warning')+metricHtml('!',t('owed'),fmtMoney(totalOwed),t('owedHelp'),totalOwed?'danger':'')+'</section>'+
    '<section class="layout"><div class="card" id="sales"><div class="card-head"><div><h2>'+t('salesTrend')+'</h2><div class="card-sub">'+t('salesTrendHelp')+'</div></div></div><div class="chart">'+dailyRows.map(([date,value])=>'<div class="bar-group"><div class="bar-value">'+fmtShortMoney(value)+'</div><div class="bar" style="height:'+Math.max(3,Math.round(value/maxDaily*175))+'px"></div><div class="bar-label">'+escapeHtml(formatDay(date))+'</div></div>').join('')+'</div></div>'+
    pulseHtml(totalRevenue,totalWasteValue,totalWasteCount,totalOwed,alerts)+'</section>'+
    '<section class="section-grid"><div class="card" id="drivers"><div class="card-head"><div><h2>'+t('driversTitle')+'</h2><div class="card-sub">'+t('driversHelp')+'</div></div></div><div class="table-wrap"><table><thead><tr><th>'+t('driver')+'</th><th class="number">'+t('revenue')+'</th><th class="number">'+t('commission')+'</th><th class="number">'+t('items')+'</th></tr></thead><tbody>'+perDriver.map((d,i)=>'<tr><td><div class="driver-name"><span class="avatar">'+escapeHtml(initials(d.name))+'</span><span><span class="rank">#'+(i+1)+'</span> '+escapeHtml(d.name)+'</span></div></td><td class="number">'+fmtMoney(d.rev)+'</td><td class="number">'+fmtMoney(d.commission)+'</td><td class="number">'+d.itemsSold+'</td></tr>').join('')+'</tbody></table></div></div>'+
    '<div class="card" id="returns"><div class="card-head"><div><h2>'+t('best')+'</h2><div class="card-sub">'+t('bestHelp')+'</div></div></div>'+(bestSellers.length?bestSellers.map(([name,qty])=>'<div class="progress-row"><div class="progress-name" title="'+escapeHtml(name)+'">'+escapeHtml(name)+'</div><div class="track"><div class="fill" style="width:'+Math.round(qty/maxSeller*100)+'%"></div></div><div class="progress-value">'+qty+'</div></div>').join(''):'<div class="empty">'+t('noData')+'</div>')+'</div></section>'+
    '<section class="card" id="cash"><div class="card-head"><div><h2>'+t('cashTitle')+'</h2><div class="card-sub">'+t('cashHelpTitle')+'</div></div></div><div class="table-wrap"><table><thead><tr><th>'+t('driver')+'</th><th class="number">'+t('cashSales')+'</th><th class="number">'+t('cashAdded')+'</th><th class="number">'+t('change')+'</th><th class="number">'+t('netCash')+'</th></tr></thead><tbody>'+perDriver.map(d=>'<tr><td><div class="driver-name"><span class="avatar">'+escapeHtml(initials(d.name))+'</span>'+escapeHtml(d.name)+'</div></td><td class="number">'+fmtMoney(d.cashSales)+'</td><td class="number">'+fmtMoney(d.topups)+'</td><td class="number">'+fmtMoney(d.changeGiven)+'</td><td class="number">'+fmtMoney(d.netCash)+'</td></tr>').join('')+'</tbody></table></div><div class="updated">'+t('updated')+': '+new Intl.DateTimeFormat(currentLanguage==='vi'?'vi-VN':'en-US',{dateStyle:'medium',timeStyle:'short'}).format(new Date())+'</div></section>';
}
function metricHtml(icon,label,value,note,kind=''){return '<article class="metric '+kind+'"><div class="metric-head"><span>'+label+'</span><span class="metric-icon">'+icon+'</span></div><div class="metric-value">'+value+'</div><div class="metric-note">'+note+'</div></article>';}
function pulseHtml(revenue,unsoldValue,unsoldCount,owed,alerts){
  const hasRisk=unsoldCount>0||owed>0;
  const title=hasRisk?t('attention'):(currentLanguage==='vi'?'Hôm nay GreenLife đang tốt':'GreenLife is looking good');
  const main=hasRisk?(unsoldValue>0?fmtMoney(unsoldValue):fmtMoney(owed)):fmtMoney(revenue);
  const copy=hasRisk?(unsoldValue>0?t('returnsAlertHelp').replace('{count}',unsoldCount).replace('{amount}',fmtMoney(unsoldValue)):t('owedAlertHelp').replace('{amount}',fmtMoney(owed))):(currentLanguage==='vi'?'Đây là tổng doanh thu trong thời gian đã chọn.':'This is your total sales for the selected time.');
  return '<div class="card pulse-card"><div class="card-head"><div><h2>'+title+'</h2><div class="card-sub">'+(hasRisk?(currentLanguage==='vi'?'Cơ hội doanh thu cần xem':'A revenue opportunity to review'):(currentLanguage==='vi'?'Tổng quan nhanh':'Quick business pulse'))+'</div></div></div><div class="pulse-number">'+main+'</div><div class="pulse-copy">'+copy+'</div><div class="quick-stats"><div class="quick-stat"><b>'+unsoldCount+'</b><span>'+t('waste')+'</span></div><div class="quick-stat"><b>'+fmtMoney(owed)+'</b><span>'+t('owed')+'</span></div></div><div class="pulse-tags"><span class="pulse-tag">'+fmtMoney(revenue)+' '+t('revenue')+'</span><span class="pulse-tag">'+t('connected')+'</span></div></div>';
}
function alertHtml(kind,icon,title,body){return '<div class="alert '+kind+'"><div class="alert-icon">'+icon+'</div><div><strong>'+title+'</strong><p>'+body+'</p></div></div>';}
function fmtShortMoney(n){return n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+Math.round(n);}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function refresh(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="card"><div class="empty">'+t('loading')+'</div></div>';
  try{
    await loadSharedMenu();
    currentDrivers = await loadAllDriverData();
    renderDashboard(currentDrivers);
  }catch(e){
    content.innerHTML = '<div class="card"><div class="empty">'
      + 'Could not load data: '+escapeHtml(e.message||String(e))
      + '<div class="hint">This dashboard needs the public-read Firestore rules to be published before it can load business data.</div></div></div>';
  }
}

document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('rangeFilter').addEventListener('change', ()=>renderDashboard(currentDrivers));
document.getElementById('langEn').addEventListener('click', ()=>{ currentLanguage='en';localStorage.setItem('greenlife-admin-language',currentLanguage);applyLanguage(); });
document.getElementById('langVi').addEventListener('click', ()=>{ currentLanguage='vi';localStorage.setItem('greenlife-admin-language',currentLanguage);applyLanguage(); });

function boot(){
  if(!FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.indexOf('REPLACE_ME')===0){
    document.body.innerHTML = '<div class="login-page"><div class="login-card"><h1>Firebase not configured</h1>'
      + '<div class="empty">Fill in firebase-config.js with your real Firebase web config, then reload this page.</div></div></div>';
    return;
  }
  initFirebase();
  refresh();
  autoRefreshTimer = window.setInterval(refresh, 5 * 60 * 1000);
}
applyLanguage();
boot();
</script>
</body>
</html>
