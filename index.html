<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Route Manifest — Daily Logger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F4EF;
    --ink:#1B2A20;
    --ink-soft:#5B6B60;
    --primary:#2F6F4E;
    --primary-dark:#1F4D36;
    --accent:#E0912E;
    --accent-soft:#FBE8C9;
    --surface:#FFFFFF;
    --border:#DDE2DA;
    --danger:#B5482E;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
  .app{max-width:520px;margin:0 auto;padding-bottom:100px;}

  .stub{background:var(--primary-dark);color:#EFEAD9;padding:16px 18px 18px;border-bottom:3px dashed rgba(239,234,217,0.35);}
  .stub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo-mark{width:38px;height:38px;color:#7BE39B;flex-shrink:0;}
  .stub h1{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 2px;letter-spacing:-0.3px;}
  .stub .sub{font-size:11px;color:#B9C9BE;font-family:'IBM Plex Mono',monospace;}
  .date-btn{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,0.08);border:1px solid rgba(239,234,217,0.4);
    color:#EFEAD9;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;
    padding:9px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;cursor:pointer;
  }
  .date-btn input[type=date]{display:none;}

  /* Calendar overlay */
  .cal-overlay{position:fixed;inset:0;background:rgba(27,42,32,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .cal-sheet{background:var(--surface);border-radius:16px;padding:16px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(0,0,0,0.25);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .cal-nav{width:38px;height:38px;border-radius:10px;border:none;background:var(--accent-soft);color:var(--primary-dark);font-size:20px;font-weight:700;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);padding:4px 0;}
  .cal-day{aspect-ratio:1;border:none;background:#F7F5EE;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;position:relative;padding:0;}
  .cal-day.has::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent);}
  .cal-day.today{outline:2px solid var(--primary);}
  .cal-day.sel{background:var(--primary);color:#fff;}
  .cal-day.sel.has::after{background:#fff;}
  .cal-actions{display:flex;gap:8px;margin-top:14px;}
  .cal-today{flex:1;padding:12px;border-radius:10px;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:13px;}
  .cal-close{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:#F0EDE3;color:var(--ink-soft);font-weight:700;font-size:13px;}
  .date-btn.past{background:var(--accent);border-color:var(--accent);color:#fff;}
  .date-btn .cal-icon{font-size:13px;}

  /* Arrival / departure — single toggle */
  .timing{border-top:1px solid var(--border);margin-top:8px;padding-top:10px;}
  .big-time-btn{
    width:100%;border:none;border-radius:12px;padding:13px 12px;
    display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;cursor:pointer;
  }
  .big-time-btn.arriving{background:var(--primary);}
  .big-time-btn.leaving{background:var(--accent);}
  .big-time-btn .btl{font-size:14px;font-weight:700;}
  .big-time-btn .bts{font-size:11px;font-family:'IBM Plex Mono',monospace;opacity:0.9;}
  .visit-list{margin-top:8px;}
  .pair-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;padding:6px 0;border-bottom:1px solid #F0EDE3;font-family:'IBM Plex Mono',monospace;}
  .pair-row:last-child{border-bottom:none;}
  .pair-row .dur{color:var(--primary-dark);font-weight:700;}
  .pair-row .open{color:var(--accent);font-weight:700;}
  .pair-row button{background:none;border:none;color:var(--ink-soft);font-weight:700;cursor:pointer;font-size:14px;}

  .stub-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .ctrl{flex:1;min-width:120px;}
  .ctrl label{display:block;font-size:10px;color:#B9C9BE;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.05em;}
  .ctrl select, .ctrl input[type=number]{
    width:100%;background:rgba(255,255,255,0.08);border:1px solid rgba(239,234,217,0.3);
    color:#EFEAD9;font-size:13px;padding:7px 8px;border-radius:8px;font-family:'Inter',sans-serif;
  }
  .ctrl select option{color:#1B2A20;}

  .stub-kpis{display:flex;gap:10px;margin-top:14px;}
  .stub-kpi{flex:1;}
  .stub-kpi .amt{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
  .stub-kpi .lbl{font-size:11px;color:#B9C9BE;}
  .stub-kpi.commission .amt{color:var(--accent);}

  .tabs{display:flex;gap:6px;padding:14px 16px 0;}
  .tab{flex:1;text-align:center;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--surface);border:1px solid var(--border);cursor:pointer;}
  .tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  .panel{padding:16px;}

  .stopper{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:10px;}
  .stopper-top{display:flex;align-items:center;justify-content:space-between;}
  .stopper button.nav{width:38px;height:38px;border-radius:10px;border:none;background:var(--accent-soft);color:var(--primary-dark);font-size:18px;font-weight:700;}
  .stop-mid{flex:1;text-align:center;}
  .stop-idx{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .stop-name-input{width:100%;text-align:center;border:none;background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--ink);}
  .stopcount-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);}
  .stopcount-row label{font-size:11px;color:var(--ink-soft);font-weight:600;}
  .stopcount-row input{width:56px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:5px;font-family:'IBM Plex Mono',monospace;font-weight:700;}

  .arrival-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .arrival-btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--primary);background:var(--primary);color:#fff;font-size:13px;font-weight:700;}
  .arrival-log{margin-top:8px;}

  .cat-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:16px 4px 8px;font-weight:600;}
  .item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .item-info{flex:1;min-width:0;}
  .item-name{font-size:14px;font-weight:600;}
  .item-price{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .counter{display:flex;align-items:center;gap:10px;}
  .counter button{width:32px;height:32px;border-radius:9px;border:none;font-size:16px;font-weight:700;}
  .counter .minus{background:#F0EDE3;color:var(--ink-soft);}
  .counter .plus{background:var(--primary);color:#fff;}
  .counter .count{min-width:22px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;}

  .req-box, .pay-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:8px;}
  .req-box .lbl, .pay-box .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;}
  .req-input-row{display:flex;gap:8px;}
  .req-input-row input{flex:1;border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:13px;}
  .req-input-row button{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:0 14px;font-weight:700;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--primary-dark);border-radius:20px;padding:5px 10px;font-size:12px;font-weight:600;margin:6px 6px 0 0;}
  .chip button{background:none;border:none;color:var(--primary-dark);font-weight:700;cursor:pointer;}
  .chip.time{background:#E6EEE8;color:var(--primary-dark);}

  .method-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .method-chip{padding:7px 10px;border-radius:9px;border:1px solid var(--border);background:#F7F5EE;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .method-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .pay-add-row{display:flex;gap:8px;}
  .pay-add-row input{flex:1;border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:13px;}
  .pay-add-row button{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:0 14px;font-weight:700;}
  .pay-sum{font-size:12px;color:var(--ink-soft);margin-top:8px;font-family:'IBM Plex Mono',monospace;}

  .eod-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .eod-item .item-name{font-size:14px;font-weight:600;}
  .eod-sold-hint{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 10px;font-family:'Space Grotesk',sans-serif;font-size:14px;}
  .kpi-row{display:flex;gap:10px;flex-wrap:wrap;}
  .kpi{flex:1;min-width:90px;background:#F7F5EE;border-radius:10px;padding:10px;text-align:center;}
  .kpi .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .kpi.warn .v{color:var(--danger);}
  .kpi.gold .v{color:var(--accent);}
  .kpi .k{font-size:10px;color:var(--ink-soft);margin-top:2px;}
  .bar-row{margin-bottom:8px;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px;}
  .bar-track{height:8px;background:#EFEDE4;border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--primary);}
  .bar-fill.waste{background:var(--danger);}
  .export-btn{width:100%;padding:12px;border-radius:10px;border:none;background:var(--primary-dark);color:#fff;font-weight:700;font-size:13px;margin-top:4px;margin-bottom:6px;}
  .export-btn.alt{background:var(--primary);}
  .export-btn.ghost{background:#F0EDE3;color:var(--ink-soft);}
  .export-btn.danger{background:var(--danger);}
  .export-note{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
  .empty{color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 0;}
  /* Running order total */
  .order-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    background:#EDEAE0;border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin:14px 0 4px;}
  .order-bar.live{background:var(--primary-dark);border-color:var(--primary-dark);}
  .ob-left{display:flex;align-items:baseline;gap:7px;}
  .ob-count{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--ink-soft);}
  .ob-lbl{font-size:11px;color:var(--ink-soft);}
  .order-bar.live .ob-count{color:#fff;}
  .order-bar.live .ob-lbl{color:#B9C9BE;}
  .ob-right{display:flex;align-items:center;gap:10px;}
  .ob-amt{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--ink-soft);}
  .order-bar.live .ob-amt{color:var(--accent);}
  .ob-clear{background:rgba(255,255,255,0.15);border:none;color:#B9C9BE;font-size:10px;font-weight:700;
    padding:5px 8px;border-radius:7px;cursor:pointer;text-transform:uppercase;}

  /* Payment ledger */
  .pay-ledger{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:10px;}
  .pay-ledger > div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #F3F1E8;}
  .pay-ledger > div:last-child{border-bottom:none;font-weight:700;padding-top:7px;}
  .pay-ledger .owing{color:var(--danger);}
  .pay-ledger .settled{color:var(--primary);}
  .pay-ledger .over{color:var(--accent);}
  .pay-fill{width:100%;padding:12px;margin-top:8px;border-radius:10px;border:none;
    background:var(--primary);color:#fff;font-weight:700;font-size:13px;}

  /* Cash pouch */
  .cash-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:8px;}
  .cash-head{display:flex;align-items:baseline;justify-content:space-between;}
  .cash-head .lbl{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.05em;}
  .cash-amt{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--primary-dark);}
  .cash-sub{font-size:11px;color:var(--ink-soft);margin-top:-2px;margin-bottom:10px;}
  .float-prompt{background:var(--accent-soft);border-radius:10px;padding:10px;font-size:12px;font-weight:600;color:var(--primary-dark);margin-bottom:10px;}
  .cash-breakdown{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:10px;}
  .cash-breakdown > div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #F3F1E8;}
  .cash-breakdown > div:last-child{border-bottom:none;}
  .edit-float{justify-content:flex-end !important;}
  .edit-float button{background:none;border:none;color:var(--accent);font-size:11px;font-weight:700;text-decoration:underline;cursor:pointer;font-family:'Inter',sans-serif;}
  .change-row{display:flex;gap:6px;}
  .change-row input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:12px 10px;font-size:16px;}
  .change-row button{background:var(--danger);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:700;font-size:13px;}
  .change-row button.topup{background:var(--primary);padding:0 12px;}
  .quick-change{display:flex;gap:6px;margin-top:8px;}
  .qc{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--border);background:#F7F5EE;font-weight:700;font-size:14px;color:var(--ink);}

  /* Mobile sizing — bigger tap targets, 16px inputs to stop iOS zoom */
  @media (max-width:520px){
    .counter button{width:44px;height:44px;font-size:20px;}
    .counter .count{min-width:30px;font-size:18px;}
    .item{padding:12px;}
    .item-name{font-size:15px;}
    .tab{padding:13px 6px;font-size:14px;}
    .stopper button.nav{width:46px;height:46px;font-size:22px;}
    .method-chip{padding:11px 13px;font-size:13px;}
    .req-input-row input,.pay-add-row input{font-size:16px;padding:12px 10px;}
    .req-input-row button,.pay-add-row button{padding:0 18px;font-size:14px;}
    .big-time-btn{padding:16px 12px;}
    .big-time-btn .btl{font-size:16px;}
    .export-btn{padding:15px;font-size:14px;}
    .stop-name-input{font-size:16px;}
    .ctrl select,.ctrl input[type=number]{font-size:16px;padding:10px 8px;}
    .date-btn{padding:11px 14px;font-size:13px;}
  }

  .brand-footer{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 0 4px;
    color:var(--ink-soft);font-size:11px;font-weight:600;letter-spacing:0.04em;opacity:0.75;}
  .logo-mark.sm{width:20px;height:20px;color:var(--primary);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ---------------- MENU DATA ---------------- */

    Sushi: [["Crunchy Roll",13.5]],

  },
  Thursday: {

    Sandwiches: [["Chicken Salad Sandwich",15]],
    Wraps: [["Chicken Spring Rolls",15],["Buffalo Chicken Wrap",15]],
    "Hot Plates": [["Broccoli Beef w/ Brown Rice",16],["Meat Lasagna",16],["Rosemary Chicken w/ Mashed Potatoes",16]],
    Sushi: [["California Roll",12],["Rainbow Roll (special order)",18]],
    "Protein Plates": [["Hot Honey Chicken",15]],
    Treats: [["Cookies",8],["Brownies",8],["Fresh Fruit",8],["Fruit Parfait",9.5],["Ham and Cheese Croissants (2pcs)",10]],
    Drinks: [["Smoothies",8],["Orange Juice",7]]
  },
  Friday: {
    Salads: [["Super Taco Salad",15],["Grilled Chicken Quinoa Salad",15]],
    Sandwiches: [["Chicken Salad Sandwich",15],["Smoked Turkey and Swiss",15]],
    Wraps: [["Chicken Spring Rolls",15],["Summer Turkey Wrap",15]],
    "Hot Plates": [["Shrimp Spinach Capellini",16],["Chicken Lemon Garlic Pasta",16]],
    Sushi: [["California Roll",12]],
    "Protein Plates": [["Chicken Salad Protein Plate",15]],
    Treats: [["Cookies",8],["Brownies",8],["Fresh Fruit",8],["Fruit Parfait",9.5],["Ham and Cheese Croissants (2pcs)",10]],
    Drinks: [["Smoothies",8],["Orange Juice",7]]
  }
};
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MENU_DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
const PAYMENT_METHODS = ["Square","Zelle","Venmo","Credit Card","Cash","Owed"];
const DEFAULT_STOP_COUNT = 10;
const COMMISSION_RATE = 0.30;

/* ---------------- STATE ---------------- */
let state = {
  tab: 'log',
  date: todayStr(),
  stopIndex: 0,
  defaultStopNames: null,
  day: null,
  allDays: {},
  activeMethod: 'Cash',
  timingOpen: false,
  calOpen: false,
  calMonth: todayStr().slice(0,7)
};

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function weekdayOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(y,m-1,d).getDay()];
}
function effectiveWeekday(day){
  return day.menuOverride || weekdayOf(day.date);
}
function fmtMoney(n){ return '$'+(Math.round(n*100)/100).toFixed(2); }
function fmtDateShort(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return MON[m-1]+' '+d;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 1400);
}

function makeStop(){ return { items:{}, requests:[], visits:[], payments:[], cashMoves:[] }; }
function emptyDay(dateStr, stopNames){
  const stops = {};
  for(let i=0;i<stopNames.length;i++){ stops[i] = makeStop(); }
  return { date:dateStr, stopNames: stopNames.slice(), menuOverride:null, stops, returns:{}, startFloat:null };
}
function normalizeDay(d, fallbackNames){
  if(!d.stopNames || !d.stopNames.length) d.stopNames = fallbackNames.slice();
  if(!d.stops) d.stops = {};
  d.stopNames.forEach((n,i)=>{
    if(!d.stops[i]) d.stops[i] = makeStop();
    const s = d.stops[i];
    if(!s.items) s.items = {};
    if(!s.requests) s.requests = [];
    if(!s.visits){
      const legacy = s.arrivals || (Array.isArray(s.arrival) ? s.arrival : (s.arrival ? [s.arrival] : []));
      s.visits = (legacy||[]).map(t=>({arrive:t, depart:null}));
    }
    if(!s.payments) s.payments = [];
    if(!s.cashMoves) s.cashMoves = [];
  });
  if(!d.returns) d.returns = {};
  if(d.startFloat === undefined) d.startFloat = null;
  if(d.menuOverride === undefined) d.menuOverride = null;
  return d;
}

/* ---------------- STORAGE (safe, with in-memory fallback) ---------------- */
const LS_PREFIX = 'routemanifest:';
const _hasRealStorage = () => (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');
const _hasLocalStorage = () => {
  try{
    if(typeof window === 'undefined' || !window.localStorage) return false;
    const t = '__test__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
};
const _memoryStore = {}; // last-resort only, used if neither storage API is available

async function storageGet(key, shared){
  if(_hasRealStorage()) return window.storage.get(key, shared);
  if(_hasLocalStorage()){
    const raw = window.localStorage.getItem(LS_PREFIX+key);
    if(raw === null) throw new Error('not found: '+key);
    return { key, value: raw, shared };
  }
  if(Object.prototype.hasOwnProperty.call(_memoryStore, key)) return { key, value:_memoryStore[key], shared };
  throw new Error('not found: '+key);
}
async function storageSet(key, value, shared){
  if(_hasRealStorage()) return window.storage.set(key, value, shared);
  if(_hasLocalStorage()){
    window.localStorage.setItem(LS_PREFIX+key, value);
    return { key, value, shared };
  }
  _memoryStore[key] = value;
  return { key, value, shared };
}
async function storageDelete(key, shared){
  if(_hasRealStorage() && window.storage.delete) return window.storage.delete(key, shared);
  if(_hasLocalStorage()){ window.localStorage.removeItem(LS_PREFIX+key); return; }
  delete _memoryStore[key];
}
async function storageList(prefix, shared){
  if(_hasRealStorage()) return window.storage.list(prefix, shared);
  if(_hasLocalStorage()){
    const keys = [];
    for(let i=0;i<window.localStorage.length;i++){
      const k = window.localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX+prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return { keys };
  }
  const keys = Object.keys(_memoryStore).filter(k=>k.startsWith(prefix));
  return { keys };
}

async function loadDefaultStopNames(){
  try{
    const r = await storageGet('stopnames_default', false);
    const arr = JSON.parse(r.value);
    if(Array.isArray(arr) && arr.length) return arr;
    throw new Error('bad');
  }catch(e){
    const def = Array.from({length:DEFAULT_STOP_COUNT}, (_,i)=>'Stop '+(i+1));
    try{ await storageSet('stopnames_default', JSON.stringify(def), false); }catch(e2){}
    return def;
  }
}
async function saveDefaultStopNames(names){
  try{ await storageSet('stopnames_default', JSON.stringify(names), false); }catch(e){}
}
async function loadDay(dateStr, fallbackNames){
  try{
    const r = await storageGet('day:'+dateStr, false);
    const d = JSON.parse(r.value);
    return normalizeDay(d, fallbackNames);
  }catch(e){
    return emptyDay(dateStr, fallbackNames);
  }
}
async function saveDay(day){
  try{ await storageSet('day:'+day.date, JSON.stringify(day), false); }catch(e){}
}
async function loadAllDays(){
  try{
    const list = await storageList('day:', false);
    const out = {};
    for(const k of (list.keys||[])){
      try{
        const r = await storageGet(k, false);
        const d = JSON.parse(r.value);
        out[d.date] = normalizeDay(d, state.defaultStopNames || ['Stop 1']);
      }catch(e){}
    }
    return out;
  }catch(e){ return {}; }
}

/* ---------------- MUTATIONS ---------------- */
function bump(itemName, delta){
  const stop = state.day.stops[state.stopIndex];
  if(!stop.items[itemName]) stop.items[itemName] = {sold:0};
  stop.items[itemName].sold = Math.max(0, stop.items[itemName].sold + delta);
  persistDay();
}
function setStartFloat(v){
  const n = parseFloat(v);
  state.day.startFloat = (isNaN(n) || n < 0) ? null : Math.round(n*100)/100;
  persistDay();
}
function addChangeGiven(amountStr){
  const amount = parseFloat(amountStr);
  if(isNaN(amount) || amount <= 0) return;
  const stop = state.day.stops[state.stopIndex];
  stop.cashMoves.push({ type:'change', amount: Math.round(amount*100)/100, time: nowTime() });
  persistDay();
  toast('Change logged');
}
function addCashTopUp(amountStr){
  const amount = parseFloat(amountStr);
  if(isNaN(amount) || amount <= 0) return;
  const stop = state.day.stops[state.stopIndex];
  stop.cashMoves.push({ type:'topup', amount: Math.round(amount*100)/100, time: nowTime() });
  persistDay();
  toast('Top-up logged');
}
function removeCashMove(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.cashMoves.splice(idx,1);
  persistDay();
}
function dayCashSales(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.payments||[]).forEach(p=>{ if(p.method==='Cash') t += p.amount; });
  });
  return t;
}
function dayChangeGiven(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.cashMoves||[]).forEach(c=>{ if(c.type==='change') t += c.amount; });
  });
  return t;
}
function dayCashTopUps(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.cashMoves||[]).forEach(c=>{ if(c.type==='topup') t += c.amount; });
  });
  return t;
}
function expectedCash(day){
  const start = day.startFloat || 0;
  return start + dayCashSales(day) + dayCashTopUps(day) - dayChangeGiven(day);
}
function stopChangeGiven(stop){
  return (stop.cashMoves||[]).reduce((s,c)=>s + (c.type==='change'?c.amount:0), 0);
}

function nowTime(){
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function openVisit(stop){
  return stop.visits.find(v=>!v.depart);
}
function logArrival(){
  const stop = state.day.stops[state.stopIndex];
  if(openVisit(stop)){ toast('Already arrived — log departure first'); return; }
  stop.visits.push({ arrive: nowTime(), depart: null });
  persistDay();
  toast('Arrival logged');
}
function logDeparture(){
  const stop = state.day.stops[state.stopIndex];
  const v = openVisit(stop);
  if(!v){ toast('Log an arrival first'); return; }
  v.depart = nowTime();
  persistDay();
  toast('Departure logged');
}
function removeVisit(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.visits.splice(idx,1);
  persistDay();
}
function parseTime(t){
  if(!t) return null;
  const m = t.match(/(\d+):(\d+)\s*(AM|PM)?/i);
  if(!m) return null;
  let h = parseInt(m[1],10); const min = parseInt(m[2],10);
  const ap = m[3] ? m[3].toUpperCase() : null;
  if(ap==='PM' && h!==12) h+=12;
  if(ap==='AM' && h===12) h=0;
  return h*60+min;
}
function visitMinutes(v){
  const a = parseTime(v.arrive), d = parseTime(v.depart);
  if(a===null || d===null) return null;
  let diff = d-a;
  if(diff < 0) diff += 24*60;
  return diff;
}
function fmtDur(mins){
  if(mins===null) return '—';
  if(mins < 60) return mins+'m';
  return Math.floor(mins/60)+'h '+(mins%60)+'m';
}
function dayDwellMinutes(day){
  let total = 0;
  Object.values(day.stops).forEach(st=>{
    (st.visits||[]).forEach(v=>{
      const m = visitMinutes(v);
      if(m!==null) total += m;
    });
  });
  return total;
}
function addRequest(text){
  if(!text.trim()) return;
  const stop = state.day.stops[state.stopIndex];
  stop.requests.push(text.trim());
  persistDay();
}
function removeRequest(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.requests.splice(idx,1);
  persistDay();
}
function addPayment(amountStr){
  const amount = parseFloat(amountStr);
  if(isNaN(amount) || amount <= 0) return;
  const stop = state.day.stops[state.stopIndex];
  stop.payments.push({ method: state.activeMethod, amount: Math.round(amount*100)/100 });
  persistDay();
}
function removePayment(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.payments.splice(idx,1);
  persistDay();
}
function bumpReturn(itemName, delta){
  if(!state.day.returns[itemName]) state.day.returns[itemName]=0;
  state.day.returns[itemName] = Math.max(0, state.day.returns[itemName]+delta);
  persistDay();
}
async function persistDay(){
  await saveDay(state.day);
  state.allDays[state.day.date] = state.day;
  render();
}
async function renameStop(newName){
  state.day.stopNames[state.stopIndex] = newName;
  await persistDay();
}
async function setStopCount(newCount){
  newCount = Math.max(1, Math.min(30, Math.round(newCount)||1));
  const names = state.day.stopNames.slice();
  if(newCount > names.length){
    for(let i=names.length; i<newCount; i++){
      names.push('Stop '+(i+1));
      if(!state.day.stops[i]) state.day.stops[i] = makeStop();
    }
  } else if(newCount < names.length){
    names.length = newCount;
    if(state.stopIndex >= newCount) state.stopIndex = newCount - 1;
  }
  state.day.stopNames = names;
  state.defaultStopNames = names.slice();
  await saveDefaultStopNames(names);
  await persistDay();
}
async function setMenuOverride(val){
  state.day.menuOverride = val || null;
  await persistDay();
}

/* ---------------- DERIVED ---------------- */
function stopItemCount(stop){
  return Object.values(stop.items||{}).reduce((s,v)=>s+(v.sold||0), 0);
}
function stopCollectedTotal(stop){
  return (stop.payments||[]).reduce((s,p)=>s+p.amount, 0);
}
function stopUnpaid(stop, weekday){
  return stopRevenue(stop, weekday) - stopCollectedTotal(stop);
}

function stopRevenue(stop, weekday){
  const menu = MENU[weekday]; if(!menu) return 0;
  let total = 0;
  Object.values(menu).flat().forEach(([name,price])=>{
    const it = stop.items[name];
    if(it) total += it.sold * price;
  });
  return total;
}
function dayRevenue(day){
  const wd = effectiveWeekday(day);
  return Object.values(day.stops).reduce((s,st)=>s+stopRevenue(st,wd),0);
}
function dayUncollected(day){
  const wd = effectiveWeekday(day);
  let gap = 0;
  Object.values(day.stops).forEach(st=>{
    const g = stopRevenue(st, wd) - stopCollectedTotal(st);
    if(g > 0) gap += g;
  });
  return gap;
}

function dayItemsSold(day){
  const totals = {};
  Object.values(day.stops).forEach(st=>{
    Object.entries(st.items).forEach(([name,v])=>{
      totals[name] = (totals[name]||0) + v.sold;
    });
  });
  return totals;
}
function dayPaymentTotals(day){
  const totals = {};
  PAYMENT_METHODS.forEach(m=>totals[m]=0);
  Object.values(day.stops).forEach(st=>{
    st.payments.forEach(p=>{ totals[p.method] = (totals[p.method]||0) + p.amount; });
  });
  return totals;
}
function dayVisitsList(day){
  const out = [];
  day.stopNames.forEach((name,i)=>{
    const st = day.stops[i];
    if(st) (st.visits||[]).forEach(v=>out.push({stop:name, arrive:v.arrive, depart:v.depart, mins:visitMinutes(v)}));
  });
  return out;
}

      });
      html += '</div>';
      html += '<div class="pay-sum">Change given at this stop: '+fmtMoney(stopChange)+'</div>';
    }
    html += '</div>';

    const visits = dayVisitsList(state.day);
    const totalDwell = dayDwellMinutes(state.day);
    html += '<div class="card"><h3>Today\'s time log (all stops)</h3>';
    if(visits.length===0){
      html += '<div class="empty">No arrivals logged yet today.</div>';
    } else {
      visits.forEach(v=>{
        html += '<div class="pair-row"><span>'+escapeHtml(v.stop)+'</span>'
          + '<span>'+v.arrive+' → '+(v.depart||'<span class="open">open</span>')
          + '  <span class="dur">'+(v.mins!==null?fmtDur(v.mins):'')+'</span></span></div>';
      });
      html += '<div class="pair-row" style="border-top:2px solid var(--border);margin-top:6px;padding-top:8px;">'
        + '<span><strong>Total time on site</strong></span><span class="dur">'+fmtDur(totalDwell)+'</span></div>';
    }
    html += '</div>';

    html += '</div>';
  }

  if(state.tab==='unsold'){
    html += '<div class="panel">';
    if(!menu){
      html += '<div class="empty">No menu selected for '+weekday+'.</div>';
    } else {
      html += '<div class="cat-label">What came back unsold today (all stops)</div>';
      const sold = dayItemsSold(state.day);
      Object.values(menu).flat().forEach(([name])=>{
        const s = sold[name] || 0;
        const ret = state.day.returns[name] || 0;
        html += '<div class="eod-item"><div><div class="item-name">'+name+'</div><div class="eod-sold-hint">sold today: '+s+'</div></div>'
          + '<div class="counter">'
          +   '<button class="minus" data-ritem="'+escapeAttr(name)+'" data-rdelta="-1">−</button>'
          +   '<span class="count">'+ret+'</span>'
          +   '<button class="plus" data-ritem="'+escapeAttr(name)+'" data-rdelta="1">+</button>'
          + '</div></div>';
      });
    }
    html += '</div>';
  }

  if(state.tab==='summary'){
    html += renderSummary();
  }

  app.innerHTML = html + renderCalendar();
  attachHandlers();
}

function renderCalendar(){
  if(!state.calOpen) return '';
  const [cy, cm] = state.calMonth.split('-').map(Number);
  const first = new Date(cy, cm-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(cy, cm, 0).getDate();
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const today = todayStr();

  let h = '<div class="cal-overlay" id="calOverlay"><div class="cal-sheet">';
  h += '<div class="cal-head">'
    + '<button class="cal-nav" id="calPrev">‹</button>'
    + '<span class="cal-title">'+MONTHS[cm-1]+' '+cy+'</span>'
    + '<button class="cal-nav" id="calNext">›</button></div>';
  h += '<div class="cal-grid">';
  ['S','M','T','W','T','F','S'].forEach(d=>{ h += '<div class="cal-dow">'+d+'</div>'; });
  for(let i=0;i<startDow;i++) h += '<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const ds = cy+'-'+String(cm).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const cls = ['cal-day'];
    if(ds === state.date) cls.push('sel');
    if(ds === today) cls.push('today');
    if(state.allDays[ds] && dayRevenue(state.allDays[ds]) > 0) cls.push('has');
    h += '<button class="'+cls.join(' ')+'" data-date="'+ds+'">'+d+'</button>';
  }
  h += '</div>';
  h += '<div class="cal-actions">'
    + '<button class="cal-today" id="calToday">Go to today</button>'
    + '<button class="cal-close" id="calClose">Close</button></div>';
  h += '</div></div>';
  return h;
}

function renderSummary(){
  const days = Object.values(state.allDays).sort((a,b)=>a.date<b.date?1:-1);
  if(days.length===0){
    return '<div class="panel"><div class="empty">No data logged yet. Start tapping sales on the Log Stop tab.</div></div>';
  }
  let totalRevenue = 0, totalCommission = 0, totalReturned = 0, totalReturnedValue = 0, totalDwell = 0;
  const soldAgg = {}, returnedAgg = {}, requestAgg = {}, paymentAgg = {};
  PAYMENT_METHODS.forEach(m=>paymentAgg[m]=0);

  days.forEach(d=>{
    const wd = effectiveWeekday(d);
    const menu = MENU[wd];
    const priceOf = name => { if(!menu) return 0; const f = Object.values(menu).flat().find(x=>x[0]===name); return f?f[1]:0; };
    const rev = dayRevenue(d);
    totalRevenue += rev;
    totalCommission += rev * COMMISSION_RATE;
    totalDwell += dayDwellMinutes(d);
    const sold = dayItemsSold(d);
    Object.entries(sold).forEach(([k,v])=>{ soldAgg[k]=(soldAgg[k]||0)+v; });
    Object.entries(d.returns||{}).forEach(([k,v])=>{
      returnedAgg[k]=(returnedAgg[k]||0)+v;
      totalReturned += v;
      totalReturnedValue += v * priceOf(k);
    });
    Object.values(d.stops).forEach(st=>{
      st.requests.forEach(r=>{ requestAgg[r]=(requestAgg[r]||0)+1; });
      st.payments.forEach(p=>{ paymentAgg[p.method] = (paymentAgg[p.method]||0) + p.amount; });
    });
  });

  let html = '<div class="panel">';
  html += '<div class="card"><h3>Across '+days.length+' logged day'+(days.length>1?'s':'')+'</h3>'
    + '<div class="kpi-row">'
    +   '<div class="kpi"><div class="v">'+fmtMoney(totalRevenue)+'</div><div class="k">TOTAL REVENUE</div></div>'
    +   '<div class="kpi gold"><div class="v">'+fmtMoney(totalCommission)+'</div><div class="k">YOUR COMMISSION</div></div>'
    +   '<div class="kpi warn"><div class="v">'+fmtMoney(totalReturnedValue)+'</div><div class="k">WASTE VALUE</div></div>'
    +   '<div class="kpi"><div class="v">'+fmtDur(totalDwell)+'</div><div class="k">TIME ON SITE</div></div>'
    + '</div></div>';

  html += '<div class="card"><h3>Payment methods (all days)</h3>';
  const payTotal = Object.values(paymentAgg).reduce((a,b)=>a+b,0) || 1;
  PAYMENT_METHODS.forEach(m=>{
    const amt = paymentAgg[m] || 0;
    html += '<div class="bar-row"><div class="top"><span>'+m+'</span><span>'+fmtMoney(amt)+'</span></div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+((amt/payTotal*100).toFixed(0))+'%"></div></div></div>';
  });
  html += '</div>';

  const soldSorted = Object.entries(soldAgg).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(soldSorted.length){
    const maxSold = soldSorted[0][1];
    html += '<div class="card"><h3>Best sellers</h3>';
    soldSorted.forEach(([name,qty])=>{
      html += '<div class="bar-row"><div class="top"><span>'+name+'</span><span>'+qty+'</span></div>'
        + '<div class="bar-track"><div class="bar-fill" style="width:'+((qty/maxSold*100).toFixed(0))+'%"></div></div></div>';
    });
    html += '</div>';
  }

  const retSorted = Object.entries(returnedAgg).sort((a,b)=>b[1]-a[1]).slice(0,8);
  if(retSorted.length){
    const maxRet = retSorted[0][1];
    html += '<div class="card"><h3>Consistently coming back (waste)</h3>';
    retSorted.forEach(([name,qty])=>{
      html += '<div class="bar-row"><div class="top"><span>'+name+'</span><span>'+qty+'</span></div>'
        + '<div class="bar-track"><div class="bar-fill waste" style="width:'+((qty/maxRet*100).toFixed(0))+'%"></div></div></div>';
    });
    html += '</div>';
  }

  const reqSorted = Object.entries(requestAgg).sort((a,b)=>b[1]-a[1]);
  if(reqSorted.length){
    html += '<div class="card"><h3>Requested but not carried (lost sales)</h3>';
    reqSorted.forEach(([name,qty])=>{
      html += '<span class="chip">'+escapeHtml(name)+' × '+qty+'</span>';
    });
    html += '</div>';
  }

  html += '<div class="card"><h3>Export</h3>'
    + '<button class="export-btn" id="exportDayCsv">Download day-by-day CSV</button>'
    + '<button class="export-btn alt" id="exportDetailCsv">Download item-by-item CSV</button>'
    + '<button class="export-btn ghost" id="exportBtn">Copy summary as text</button>'
    + '<div class="export-note">CSV files open in Excel or Google Sheets. One row per day, or one row per item per stop.</div>'
    + '</div>';
  html += '<div class="card"><h3>Reset</h3>'
    + '<button class="export-btn danger" id="resetBtn">'+(state.confirmReset?'Tap again to confirm — this deletes everything':'Clear all logged data')+'</button>'
    + '<div class="export-note">Wipes every logged day. Download your CSVs first if you want to keep the history.</div>'
    + '</div>';
  html += '<div class="brand-footer">'
    + '<svg class="logo-mark sm" viewBox="0 0 100 100" aria-hidden="true">'
    +   '<circle cx="50" cy="46" r="34" fill="none" stroke="currentColor" stroke-width="5"/>'
    +   '<path d="M50 82 L50 40" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>'
    +   '<path d="M39 24 L39 42 Q39 48 44 49 L50 50 M44 24 L44 42 M50 24 L50 40 M56 24 L56 42" '
    +     'stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>'
    +   '<path d="M52 74 Q52 46 78 38 Q80 66 54 72 Z" fill="currentColor"/>'
    + '</svg>'
    + '<span>GreenLife Fit Foods — route log</span></div>';
  html += '</div>';
  return html;
}

function csvEscape(s){
  s = String(s == null ? '' : s);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function buildDetailCSV(){
  const days = Object.values(state.allDays).sort((a,b)=>a.date<b.date?-1:1);
  const rows = [['Date','Weekday','Stop','Item','Category','UnitPrice','QtySold','LineRevenue']];
  days.forEach(d=>{
    const wd = effectiveWeekday(d);
    const menu = MENU[wd];
    if(!menu) return;
    d.stopNames.forEach((stopName,i)=>{
      const st = d.stops[i];
      if(!st) return;
      Object.entries(menu).forEach(([cat, items])=>{
        items.forEach(([name, price])=>{
          const qty = (st.items[name] && st.items[name].sold) || 0;
          if(qty > 0){
            rows.push([d.date, wd, stopName, name, cat, price.toFixed(2), qty, (qty*price).toFixed(2)]);
          }
        });
      });
    });
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}
function buildDayCSV(){
  const days = Object.values(state.allDays).sort((a,b)=>a.date<b.date?-1:1);
  const rows = [['Date','Weekday','Stops','Revenue','Commission30','ItemsSold','ItemsUnsold','UnsoldValue','MinutesOnSite','StartFloat','ChangeGiven','CashAdded','ExpectedCash','Square','Zelle','Venmo','CreditCard','Cash','Owed']];
  days.forEach(d=>{
    const wd = effectiveWeekday(d);
    const menu = MENU[wd];
    const priceOf = name => { if(!menu) return 0; const f = Object.values(menu).flat().find(x=>x[0]===name); return f?f[1]:0; };
    const rev = dayRevenue(d);
    const sold = dayItemsSold(d);
    const soldCount = Object.values(sold).reduce((a,b)=>a+b,0);
    let unsoldCount = 0, unsoldValue = 0;
    Object.entries(d.returns||{}).forEach(([k,v])=>{ unsoldCount += v; unsoldValue += v*priceOf(k); });
    const pt = dayPaymentTotals(d);
    rows.push([
      d.date, wd, d.stopNames.length, rev.toFixed(2), (rev*COMMISSION_RATE).toFixed(2),
      soldCount, unsoldCount, unsoldValue.toFixed(2), dayDwellMinutes(d),
      (d.startFloat||0).toFixed(2), dayChangeGiven(d).toFixed(2), dayCashTopUps(d).toFixed(2), expectedCash(d).toFixed(2),
      (pt['Square']||0).toFixed(2), (pt['Zelle']||0).toFixed(2), (pt['Venmo']||0).toFixed(2),
      (pt['Credit Card']||0).toFixed(2), (pt['Cash']||0).toFixed(2), (pt['Owed']||0).toFixed(2)
    ]);
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}
function downloadCSV(filename, text){
  try{
    const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast('Downloaded '+filename);
  }catch(e){
    toast('Download blocked — use Copy instead');
  }
}

function buildExportText(){
  const days = Object.values(state.allDays).sort((a,b)=>a.date<b.date?-1:1);
  let out = 'ROUTE MANIFEST SUMMARY\n';
  out += 'Days logged: '+days.length+'\n\n';
  let totalRevenue=0, totalCommission=0;
  days.forEach(d=>{
    const wd = effectiveWeekday(d);
    const r = dayRevenue(d);
    totalRevenue += r;
    totalCommission += r*COMMISSION_RATE;
    out += d.date+' ('+wd+'): '+fmtMoney(r)+' revenue, '+fmtMoney(r*COMMISSION_RATE)+' commission\n';
  });
  out += '\nTOTAL REVENUE: '+fmtMoney(totalRevenue)+'\n';
  out += 'TOTAL COMMISSION (30%): '+fmtMoney(totalCommission)+'\n';
  return out;
}

/* ---------------- HANDLERS ---------------- */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function attachHandlers(){
  const dateBtn = document.getElementById('dateBtn');
  if(dateBtn) dateBtn.addEventListener('click', ()=>{
    state.calMonth = state.date.slice(0,7);
    state.calOpen = true;
    render();
  });

  const calOverlay = document.getElementById('calOverlay');
  if(calOverlay) calOverlay.addEventListener('click', (e)=>{
    if(e.target.id === 'calOverlay'){ state.calOpen = false; render(); }
  });
  const calClose = document.getElementById('calClose');
  if(calClose) calClose.addEventListener('click', ()=>{ state.calOpen = false; render(); });
  const calPrev = document.getElementById('calPrev');
  if(calPrev) calPrev.addEventListener('click', ()=>{
    let [y,m] = state.calMonth.split('-').map(Number);
    m--; if(m<1){ m=12; y--; }
    state.calMonth = y+'-'+String(m).padStart(2,'0');
    render();
  });
  const calNext = document.getElementById('calNext');
  if(calNext) calNext.addEventListener('click', ()=>{
    let [y,m] = state.calMonth.split('-').map(Number);
    m++; if(m>12){ m=1; y++; }
    state.calMonth = y+'-'+String(m).padStart(2,'0');
    render();
  });
  const calToday = document.getElementById('calToday');
  if(calToday) calToday.addEventListener('click', ()=>selectDate(todayStr()));
  document.querySelectorAll('.cal-day').forEach(b=>{
    b.addEventListener('click', ()=>selectDate(b.dataset.date));
  });

  const menuSelect = document.getElementById('menuSelect');
  if(menuSelect) menuSelect.addEventListener('change', e=>{ setMenuOverride(e.target.value); });

  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ state.tab = t.dataset.tab; render(); });
  });

  const prevStop = document.getElementById('prevStop');
  if(prevStop) prevStop.addEventListener('click', ()=>{
    state.stopIndex = (state.stopIndex - 1 + state.day.stopNames.length) % state.day.stopNames.length;
    render();
  });
  const nextStop = document.getElementById('nextStop');
  if(nextStop) nextStop.addEventListener('click', ()=>{
    state.stopIndex = (state.stopIndex + 1) % state.day.stopNames.length;
    render();
  });

  const stopNameInput = document.getElementById('stopNameInput');
  if(stopNameInput) stopNameInput.addEventListener('change', e=>{ renameStop(e.target.value); });

  ['stopCountInput','stopCountInput2'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', e=>{ setStopCount(parseInt(e.target.value,10)); });
  });

  const timeToggle = document.getElementById('timeToggle');
  if(timeToggle) timeToggle.addEventListener('click', ()=>{
    const stop = state.day.stops[state.stopIndex];
    if(openVisit(stop)) logDeparture(); else logArrival();
  });
  document.querySelectorAll('.visitRemove').forEach(b=>{
    b.addEventListener('click', ()=>removeVisit(parseInt(b.dataset.vidx,10)));
  });

  document.querySelectorAll('[data-item]').forEach(b=>{
    b.addEventListener('click', ()=>{
      bump(b.dataset.item, parseInt(b.dataset.delta,10));
      if(b.dataset.delta==='1') toast('Sale logged');
    });
  });
  document.querySelectorAll('[data-ritem]').forEach(b=>{
    b.addEventListener('click', ()=>{ bumpReturn(b.dataset.ritem, parseInt(b.dataset.rdelta,10)); });
  });

  const reqAdd = document.getElementById('reqAdd');
  if(reqAdd) reqAdd.addEventListener('click', ()=>{
    const inp = document.getElementById('reqInput');
    addRequest(inp.value); inp.value='';
  });
  document.querySelectorAll('.reqRemove').forEach(b=>{
    b.addEventListener('click', ()=>removeRequest(parseInt(b.dataset.idx,10)));
  });

  const payFill = document.getElementById('payFill');
  if(payFill) payFill.addEventListener('click', ()=>{
    const stop = state.day.stops[state.stopIndex];
    const wd = effectiveWeekday(state.day);
    const remaining = stopRevenue(stop, wd) - stopCollectedTotal(stop);
    if(remaining > 0.005) addPayment(remaining.toFixed(2));
  });
  const clearStop = document.getElementById('clearStop');
  if(clearStop) clearStop.addEventListener('click', ()=>{
    if(state.confirmClearStop){
      state.confirmClearStop = false;
      state.day.stops[state.stopIndex].items = {};
      persistDay();
      toast('Stop items cleared');
    } else {
      state.confirmClearStop = true;
      toast('Tap clear again to confirm');
      setTimeout(()=>{ state.confirmClearStop = false; }, 4000);
    }
  });

  document.querySelectorAll('.method-chip').forEach(b=>{
    b.addEventListener('click', ()=>{ state.activeMethod = b.dataset.method; render(); });
  });
  const payAdd = document.getElementById('payAdd');
  if(payAdd) payAdd.addEventListener('click', ()=>{
    const inp = document.getElementById('payAmount');
    addPayment(inp.value); inp.value='';
  });
  document.querySelectorAll('.payRemove').forEach(b=>{
    b.addEventListener('click', ()=>removePayment(parseInt(b.dataset.pidx,10)));
  });

  const floatSet = document.getElementById('floatSet');
  if(floatSet) floatSet.addEventListener('click', ()=>{
    setStartFloat(document.getElementById('floatInput').value);
  });
  const floatEdit = document.getElementById('floatEdit');
  if(floatEdit) floatEdit.addEventListener('click', ()=>{
    state.day.startFloat = null; persistDay();
  });
  const changeAdd = document.getElementById('changeAdd');
  if(changeAdd) changeAdd.addEventListener('click', ()=>{
    const inp = document.getElementById('changeInput');
    addChangeGiven(inp.value); inp.value='';
  });
  const topupAdd = document.getElementById('topupAdd');
  if(topupAdd) topupAdd.addEventListener('click', ()=>{
    const inp = document.getElementById('changeInput');
    addCashTopUp(inp.value); inp.value='';
  });
  document.querySelectorAll('.qc').forEach(b=>{
    b.addEventListener('click', ()=>addChangeGiven(b.dataset.qc));
  });
  document.querySelectorAll('.cashRemove').forEach(b=>{
    b.addEventListener('click', ()=>removeCashMove(parseInt(b.dataset.cidx,10)));
  });

  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(state.confirmReset){ state.confirmReset = false; resetAllData(); }
    else { state.confirmReset = true; render(); setTimeout(()=>{ if(state.confirmReset){ state.confirmReset=false; render(); } }, 5000); }
  });

  const exportDayCsv = document.getElementById('exportDayCsv');
  if(exportDayCsv) exportDayCsv.addEventListener('click', ()=>{
    downloadCSV('route_days_'+todayStr()+'.csv', buildDayCSV());
  });
  const exportDetailCsv = document.getElementById('exportDetailCsv');
  if(exportDetailCsv) exportDetailCsv.addEventListener('click', ()=>{
    downloadCSV('route_items_'+todayStr()+'.csv', buildDetailCSV());
  });
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', async ()=>{
    const text = buildExportText();
    try{ await navigator.clipboard.writeText(text); toast('Copied to clipboard'); }
    catch(e){ toast('Could not copy — select manually'); }
  });
}

async function resetAllData(){
  try{
    const list = await storageList('day:', false);
    for(const k of (list.keys||[])){
      try{ await storageDelete(k, false); }
      catch(e){ try{ await storageSet(k, JSON.stringify(emptyDay(k.slice(4), state.defaultStopNames)), false); }catch(e2){} }
    }
  }catch(e){}
  state.allDays = {};
  state.date = todayStr();
  state.manualDate = false;
  state.stopIndex = 0;
  state.day = emptyDay(state.date, state.defaultStopNames);
  await saveDay(state.day);
  state.allDays[state.date] = state.day;
  state.tab = 'log';
  render();
  toast('All data cleared');
}

async function selectDate(ds){
  state.date = ds;
  state.manualDate = (ds !== todayStr());
  state.stopIndex = 0;
  state.calOpen = false;
  state.day = await loadDay(state.date, state.defaultStopNames);
  state.allDays[state.date] = state.day;
  render();
}

async function syncToToday(force){
  const real = todayStr();
  if(state.date === real) return false;
  if(!force && state.manualDate) return false;
  state.date = real;
  state.stopIndex = 0;
  state.manualDate = false;
  state.day = await loadDay(state.date, state.defaultStopNames);
  state.allDays[state.date] = state.day;
  render();
  return true;
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && state.day) syncToToday(false);
});

/* ---------------- INIT ---------------- */
async function init(){
  try{
    state.defaultStopNames = await loadDefaultStopNames();
    // One-time fresh start: clear any prior test data on first load of this build
    let fresh = false;
    try{ await storageGet('reset_v2', false); }
    catch(e){ fresh = true; }
    if(fresh){
      try{
        const list = await storageList('day:', false);
        for(const k of (list.keys||[])){
          try{ await storageDelete(k, false); }catch(e2){}
        }
      }catch(e3){}
      try{ await storageSet('reset_v2','done',false); }catch(e4){}
    }
    state.day = await loadDay(state.date, state.defaultStopNames);
    state.allDays = await loadAllDays();
    state.allDays[state.date] = state.day;
    render();
  }catch(err){
    document.getElementById('app').innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#B5482E;"><h3>Something failed to load</h3>'
      + '<p style="font-size:13px;color:#333;">'+(err && err.message ? err.message : String(err))+'</p></div>';
  }
}
window.addEventListener('error', (e)=>{
  const app = document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#B5482E;"><h3>Script error</h3>'
      + '<p style="font-size:13px;color:#333;">'+(e.message||'unknown')+'</p></div>';
  }
});
init();
</script>
