<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Route Manifest — Daily Logger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#DFE5C7;
    --bg-2:#BFD2BB;
    --bg-3:#AFC1BC;
    --ink:#122635;
    --ink-soft:#4A6477;
    --primary:#2A8084;
    --primary-dark:#184E77;
    --ocean:#1A759F;
    --teal:#52B69A;
    --mint:#99D98C;
    --sprout:#B5E48C;
    --lime:#D9ED92;
    --accent:#34A0A4;
    --accent-soft:rgba(181,228,140,0.32);
    --lime-soft:rgba(217,237,146,0.38);
    --gold:#D9ED92;
    --danger:#BF4726;
    --danger-vivid:#E0632F;
    --surface:rgba(255,255,255,0.58);
    --surface-strong:rgba(255,255,255,0.78);
    --border:rgba(255,255,255,0.7);
    --hairline:rgba(18,38,53,0.09);
    --shadow:0 6px 22px rgba(18,52,60,0.10);
    --shadow-lift:0 10px 34px rgba(18,52,60,0.16);
    --radius:20px;
    --radius-sm:13px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(168deg,var(--bg-1) 0%,var(--bg-2) 46%,var(--bg-3) 100%);
    background-attachment:fixed;
    min-height:100vh;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:520px;margin:0 auto;padding-bottom:100px;}

  /* ---------- Header: floating ocean panel ---------- */
  .stub{
    position:relative;
    margin:12px 12px 0;
    padding:18px 18px 20px;
    border-radius:26px;
    background:linear-gradient(142deg,rgba(26,117,159,0.94) 0%,rgba(24,78,119,0.97) 100%);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 12px 34px rgba(18,52,80,0.28);
    color:#EAF3EC;
    overflow:hidden;
  }
  .stub::after{
    content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;
    background:radial-gradient(circle,rgba(217,237,146,0.22) 0%,transparent 70%);
    pointer-events:none;
  }
  .stub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;}
  .brand{display:flex;align-items:center;gap:11px;}
  .logo-mark{width:40px;height:40px;flex-shrink:0;object-fit:contain;border-radius:12px;}
  .logo-mark.sm{width:20px;height:20px;object-fit:contain;border-radius:6px;}
  .stub h1{font-family:'Space Grotesk',sans-serif;font-size:23px;margin:0 0 1px;letter-spacing:-0.4px;font-weight:600;}
  .stub .sub{font-size:12px;color:rgba(217,237,146,0.85);font-family:'IBM Plex Mono',monospace;letter-spacing:0.14em;}

  .header-right{display:flex;align-items:center;gap:7px;}
  .day-stepper{display:flex;align-items:center;gap:4px;}
  .day-step{
    width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.12);color:#EAF3EC;font-size:17px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .day-step:active{background:rgba(255,255,255,0.22);}
  .lang-toggle{
    background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);
    color:#EAF3EC;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;
    padding:9px 10px;border-radius:12px;cursor:pointer;letter-spacing:0.05em;
  }
  .date-btn{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);
    color:#EAF3EC;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;cursor:pointer;
  }
  .date-btn input[type=date]{display:none;}
  .date-btn.past{background:var(--lime);border-color:var(--lime);color:var(--primary-dark);}
  .date-btn .cal-icon{font-size:14px;}

  .seller-row{margin-top:12px;position:relative;}
  .seller-row input{
    width:100%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
    color:#EAF3EC;font-size:15px;padding:10px 13px;border-radius:13px;font-family:'Inter',sans-serif;
  }
  .seller-row input::placeholder{color:rgba(234,243,236,0.55);}

  .stub-controls{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;position:relative;}
  .ctrl{flex:1;min-width:120px;}
  .ctrl label{display:block;font-size:10px;color:rgba(217,237,146,0.8);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.1em;font-weight:600;}
  .ctrl select,.ctrl input[type=number]{
    width:100%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
    color:#EAF3EC;font-size:15px;padding:9px 10px;border-radius:12px;font-family:'Inter',sans-serif;
  }
  .ctrl select option{color:#122635;}

  .stub-kpis{display:flex;gap:12px;margin-top:18px;position:relative;}
  .stub-kpi{flex:1;}
  .stub-kpi .amt{font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1;}
  .stub-kpi .lbl{font-size:12px;color:rgba(234,243,236,0.62);margin-top:5px;letter-spacing:0.03em;}
  .stub-kpi.commission .amt{color:var(--lime);}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:6px;padding:14px 14px 0;}
  .tab{
    flex:1;text-align:center;padding:11px 6px;border-radius:14px;
    font-size:15px;font-weight:600;color:var(--ink-soft);
    background:var(--surface);border:1px solid var(--border);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    cursor:pointer;transition:background .18s,color .18s;
  }
  .tab.active{background:var(--primary);color:#fff;border-color:transparent;box-shadow:var(--shadow);}

  .panel{padding:14px;}

  /* ---------- Glass card base ---------- */
  .stopper,.card,.item,.req-box,.pay-box,.cash-box,.eod-item,.cal-sheet{
    background:var(--surface);
    -webkit-backdrop-filter:blur(18px) saturate(1.15);
    backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
  }

  .stopper{border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .stopper-top{display:flex;align-items:center;justify-content:space-between;}
  .stopper button.nav{
    width:42px;height:42px;border-radius:14px;border:none;
    background:rgba(255,255,255,0.66);color:var(--primary-dark);font-size:22px;font-weight:700;cursor:pointer;
  }
  .stop-mid{flex:1;text-align:center;padding:0 6px;}
  .stop-idx{font-size:10px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;letter-spacing:0.12em;}
  .stop-name-input{width:100%;text-align:center;border:none;background:transparent;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;color:var(--ink);letter-spacing:-0.2px;}
  .stopcount-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline);}
  .stopcount-row label{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .stopcount-row input{width:58px;text-align:center;border:1px solid var(--hairline);background:rgba(255,255,255,0.6);border-radius:10px;padding:6px;font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--ink);}

  /* ---------- Arrival / departure ---------- */
  .timing{border-top:1px solid var(--hairline);margin-top:10px;padding-top:11px;}
  .big-time-btn{
    width:100%;border:none;border-radius:16px;padding:14px 12px;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;cursor:pointer;
    box-shadow:var(--shadow);
  }
  .big-time-btn.arriving{background:linear-gradient(135deg,var(--primary) 0%,#237074 100%);}
  .big-time-btn.leaving{background:linear-gradient(135deg,var(--lime) 0%,#C4DE7A 100%);color:var(--primary-dark);}
  .big-time-btn .btl{font-size:16px;font-weight:700;letter-spacing:-0.1px;}
  .big-time-btn .bts{font-size:13px;font-family:'IBM Plex Mono',monospace;opacity:0.82;}
  .visit-list{margin-top:9px;}
  .arrival-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
  .arrival-btn{width:100%;padding:12px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:700;}
  .arrival-log{margin-top:8px;}

  .pair-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--hairline);font-family:'IBM Plex Mono',monospace;}
  .pair-row:last-child{border-bottom:none;}
  .pair-row.drive-row{color:var(--ocean);font-style:italic;padding-left:10px;}
  .pair-row .dur{color:var(--primary);font-weight:700;}
  .pair-row .open{color:var(--danger);font-weight:700;}
  .pair-row button{background:none;border:none;color:var(--ink-soft);font-weight:700;cursor:pointer;font-size:16px;}

  /* ---------- Running order bar ---------- */
  .order-bar{
    position:sticky;top:8px;z-index:20;display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-strong);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:16px;padding:12px 15px;margin:14px 0 6px;
    box-shadow:var(--shadow);
  }
  .order-bar.live{
    background:linear-gradient(135deg,rgba(26,117,159,0.95),rgba(24,78,119,0.96));
    border-color:transparent;box-shadow:var(--shadow-lift);
  }
  .ob-left{display:flex;align-items:baseline;gap:7px;}
  .ob-count{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;color:var(--ink-soft);}
  .ob-lbl{font-size:13px;color:var(--ink-soft);}
  .order-bar.live .ob-count{color:#fff;}
  .order-bar.live .ob-lbl{color:rgba(234,243,236,0.7);}
  .ob-right{display:flex;align-items:center;gap:10px;}
  .ob-amt{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;color:var(--ink-soft);letter-spacing:-0.5px;}
  .order-bar.live .ob-amt{color:var(--lime);}
  .ob-clear{background:rgba(255,255,255,0.18);border:none;color:rgba(234,243,236,0.85);font-size:12px;font-weight:700;
    padding:6px 9px;border-radius:9px;cursor:pointer;text-transform:uppercase;letter-spacing:0.06em;}

  /* ---------- Items ---------- */
  .cat-label{
    font-size:12px;text-transform:uppercase;letter-spacing:0.14em;
    color:var(--ink-soft);margin:20px 4px 9px;font-weight:700;
  }
  .cat-label.top-label{color:var(--primary);}
  .item{border-radius:var(--radius-sm);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .item.top{background:var(--lime-soft);border:1px solid rgba(153,217,140,0.75);}
  .item-info{flex:1;min-width:0;}
  .item-name{font-size:16px;font-weight:600;letter-spacing:-0.1px;}
  .item-price{font-size:13px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:1px;}
  .counter{display:flex;align-items:center;gap:7px;}
  .counter button{width:40px;height:40px;border-radius:13px;border:none;font-size:20px;font-weight:700;flex-shrink:0;cursor:pointer;}
  .counter .minus{background:rgba(255,255,255,0.72);color:var(--ink-soft);}
  .counter .plus{background:var(--primary);color:#fff;}
  .counter .plus2{background:var(--teal);color:var(--primary-dark);font-size:16px;}
  .counter .count{min-width:24px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;}
  .counter.big button{width:52px;height:52px;font-size:23px;border-radius:16px;}
  .counter.big .plus2{font-size:17px;}
  .counter.big .count{min-width:32px;font-size:23px;}

  /* ---------- Requests / payments / cash ---------- */
  .req-box,.pay-box{border-radius:var(--radius);padding:14px;margin-top:9px;}
  .req-box .lbl,.pay-box .lbl{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.08em;}
  .req-input-row{display:flex;gap:8px;}
  .req-input-row input{flex:1;border:1px solid var(--hairline);background:rgba(255,255,255,0.66);border-radius:12px;padding:10px 11px;font-size:15px;color:var(--ink);}
  .req-input-row button{background:var(--teal);color:var(--primary-dark);border:none;border-radius:12px;padding:0 15px;font-weight:700;cursor:pointer;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--primary-dark);border-radius:20px;padding:6px 11px;font-size:14px;font-weight:600;margin:7px 6px 0 0;}
  .chip.fee{background:rgba(255,255,255,0.6);color:var(--ink-soft);font-style:italic;}
  .chip.time{background:rgba(82,182,154,0.24);color:var(--primary-dark);}
  .chip button{background:none;border:none;color:var(--primary-dark);font-weight:700;cursor:pointer;}

  .pay-ledger{font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:12px;}
  .pay-ledger > div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hairline);}
  .pay-ledger > div:last-child{border-bottom:none;font-weight:700;padding-top:8px;}
  .pay-ledger .owing{color:var(--danger);}
  .pay-ledger .settled{color:var(--primary);}
  .pay-ledger .over{color:var(--ocean);}
  .pay-fill{width:100%;padding:13px;margin-top:9px;border-radius:14px;border:none;
    background:linear-gradient(135deg,var(--primary),#237074);color:#fff;font-weight:700;font-size:15px;box-shadow:var(--shadow);cursor:pointer;}

  .method-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px;}
  .method-chip{padding:9px 12px;border-radius:12px;border:1px solid var(--hairline);background:rgba(255,255,255,0.55);font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  .method-chip.active{background:var(--primary);color:#fff;border-color:transparent;}
  .pay-add-row{display:flex;gap:8px;}
  .pay-add-row input{flex:1;border:1px solid var(--hairline);background:rgba(255,255,255,0.66);border-radius:12px;padding:10px 11px;font-size:15px;color:var(--ink);}
  .pay-add-row button{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:0 15px;font-weight:700;cursor:pointer;}
  .pay-sum{font-size:14px;color:var(--ink-soft);margin-top:9px;font-family:'IBM Plex Mono',monospace;}
  .fee-note{font-size:13px;color:var(--ocean);margin-top:7px;font-weight:600;}

  .cash-box{border-radius:var(--radius);padding:15px;margin-top:9px;}
  .cash-head{display:flex;align-items:baseline;justify-content:space-between;}
  .cash-head .lbl{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;}
  .cash-amt{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;color:var(--primary);letter-spacing:-0.8px;}
  .cash-sub{font-size:13px;color:var(--ink-soft);margin-top:1px;margin-bottom:12px;}
  .float-prompt{background:var(--lime-soft);border-radius:13px;padding:11px;font-size:14px;font-weight:600;color:var(--primary-dark);margin-bottom:11px;}
  .cash-breakdown{font-family:'IBM Plex Mono',monospace;font-size:14px;margin-bottom:11px;}
  .cash-breakdown > div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--hairline);}
  .cash-breakdown > div:last-child{border-bottom:none;}
  .edit-float{justify-content:flex-end !important;}
  .edit-float button{background:none;border:none;color:var(--ocean);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;font-family:'Inter',sans-serif;}
  .change-row{display:flex;gap:6px;}
  .change-row input{flex:1;min-width:0;border:1px solid var(--hairline);background:rgba(255,255,255,0.66);border-radius:12px;padding:12px 11px;font-size:18px;color:var(--ink);}
  .change-row button{background:var(--danger);color:#fff;border:none;border-radius:12px;padding:0 16px;font-weight:700;font-size:15px;cursor:pointer;}
  .change-row button.topup{background:var(--primary);padding:0 13px;}
  .quick-change{display:flex;gap:6px;margin-top:9px;}
  .qc{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--hairline);background:rgba(255,255,255,0.55);font-weight:700;font-size:16px;color:var(--ink);cursor:pointer;}

  /* ---------- Unsold ---------- */
  .eod-item{border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
  .eod-item .item-name{font-size:16px;font-weight:600;}
  .eod-sold-hint{font-size:13px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;margin-top:1px;}

  /* ---------- Summary ---------- */
  .card{border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card h3{margin:0 0 12px;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-0.2px;}
  .kpi-row{display:flex;gap:9px;flex-wrap:wrap;}
  .kpi{flex:1;min-width:92px;background:rgba(255,255,255,0.5);border:1px solid var(--border);border-radius:14px;padding:12px 10px;text-align:center;}
  .kpi .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;letter-spacing:-0.4px;}
  .kpi.warn .v{color:var(--danger);}
  .kpi.gold .v{color:var(--lime);background:var(--primary-dark);border-radius:8px;padding:3px 7px;display:inline-block;}
  .kpi .k{font-size:10px;color:var(--ink-soft);margin-top:5px;letter-spacing:0.06em;text-transform:uppercase;}
  .bar-row{margin-bottom:10px;}
  .day-multi-row{margin-bottom:16px;}
  .day-multi-sub{display:flex;gap:14px;margin-top:5px;font-size:13px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  button.month-row{
    display:block;width:100%;background:none;border:none;padding:0;margin-bottom:10px;
    cursor:pointer;text-align:left;font-family:inherit;
  }
  .month-row .bar-track{height:10px;}
  .month-row.sel .top span:first-child{color:var(--primary);font-weight:700;}
  .bar-fill.month-sel{background:linear-gradient(90deg,var(--lime),var(--teal));}
  .month-detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline);}
  .bar-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;}
  .bar-track{height:8px;background:rgba(18,38,53,0.08);border-radius:6px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--primary));border-radius:6px;}
  .bar-fill.waste{background:linear-gradient(90deg,var(--danger-vivid),var(--danger));}
  .export-btn{width:100%;padding:14px;border-radius:14px;border:none;background:var(--primary-dark);color:#fff;font-weight:700;font-size:15px;margin-top:4px;margin-bottom:7px;cursor:pointer;box-shadow:var(--shadow);}
  .export-btn.alt{background:var(--ocean);}
  .export-btn.ghost{background:rgba(255,255,255,0.6);color:var(--ink-soft);box-shadow:none;}
  .export-btn.danger{background:var(--danger);}
  .export-btn.xlsx{background:linear-gradient(135deg,var(--primary),#237074);}
  .export-note{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
  .empty{color:var(--ink-soft);font-size:15px;text-align:center;padding:22px 0;}

  .brand-footer{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0 6px;
    color:var(--ink-soft);font-size:13px;font-weight:600;letter-spacing:0.04em;opacity:0.8;}

  /* ---------- Calendar ---------- */
  .cal-overlay{position:fixed;inset:0;background:rgba(18,38,53,0.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .cal-sheet{background:rgba(255,255,255,0.9);border-radius:24px;padding:18px;width:100%;max-width:340px;box-shadow:var(--shadow-lift);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;}
  .cal-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:18px;}
  .cal-nav{width:40px;height:40px;border-radius:13px;border:none;background:var(--lime-soft);color:var(--primary-dark);font-size:23px;font-weight:700;cursor:pointer;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--ink-soft);padding:5px 0;letter-spacing:0.08em;}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}
function shiftDate(dateStr, days){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate() + days);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,'0')+"-"+String(dt.getDate()).padStart(2,'0');
}
function weekdayOf(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  return WEEKDAYS[new Date(y,m-1,d).getDay()];
}
function effectiveWeekday(day){
  return day.menuOverride || weekdayOf(day.date);
}
function fmtMoney(n){ return '$'+(Math.round(n*100)/100).toFixed(2); }
function fmtDateShort(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return MON[m-1]+' '+d;
}

}

const SQUARE_FEE = 0.50;
function makeStop(){ return { items:{}, requests:[], visits:[], payments:[], cashMoves:[] }; }
function emptyDay(dateStr, stopNames){
  const stops = {};
  for(let i=0;i<stopNames.length;i++){ stops[i] = makeStop(); }
  return { date:dateStr, stopNames: stopNames.slice(), menuOverride:null, stops, returns:{}, startFloat:null };
}
function normalizeDay(d, fallbackNames){
  if(!d.stopNames || !d.stopNames.length) d.stopNames = fallbackNames.slice();
  if(!d.stops) d.stops = {};
  const wd = (d.menuOverride) || weekdayOf(d.date);
  d.stopNames.forEach((n,i)=>{
    if(!d.stops[i]) d.stops[i] = makeStop();
    const s = d.stops[i];
    if(!s.items) s.items = {};
    Object.keys(s.items).forEach(name=>{
      const it = s.items[name];
      if(it.price === undefined || it.price === null){
        const p = priceForItem(name, wd);
        it.price = (p != null) ? p : 0;
      }
    });
    if(!s.requests) s.requests = [];
    if(!s.visits){
      const legacy = s.arrivals || (Array.isArray(s.arrival) ? s.arrival : (s.arrival ? [s.arrival] : []));
      s.visits = (legacy||[]).map(t=>({arrive:t, depart:null}));
    }
    if(!s.payments) s.payments = [];
    if(!s.cashMoves) s.cashMoves = [];
  });
  if(!d.returns) d.returns = {};
  if(d.startFloat === undefined) d.startFloat = null;
  if(d.menuOverride === undefined) d.menuOverride = null;
  return d;
}

/* ---------------- STORAGE (safe, with in-memory fallback) ---------------- */
const LS_PREFIX = 'routemanifest:';
const _hasRealStorage = () => (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');
const _hasLocalStorage = () => {
  try{
    if(typeof window === 'undefined' || !window.localStorage) return false;
    const t = '__test__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
};
const _memoryStore = {}; // last-resort only, used if neither storage API is available

async function storageGet(key, shared){
  if(_hasRealStorage()) return window.storage.get(key, shared);
  if(_hasLocalStorage()){
    const raw = window.localStorage.getItem(LS_PREFIX+key);
    if(raw === null) throw new Error('not found: '+key);
    return { key, value: raw, shared };
  }
  if(Object.prototype.hasOwnProperty.call(_memoryStore, key)) return { key, value:_memoryStore[key], shared };
  throw new Error('not found: '+key);
}
async function storageSet(key, value, shared){
  if(_hasRealStorage()) return window.storage.set(key, value, shared);
  if(_hasLocalStorage()){
    window.localStorage.setItem(LS_PREFIX+key, value);
    return { key, value, shared };
  }
  _memoryStore[key] = value;
  return { key, value, shared };
}
async function storageDelete(key, shared){
  if(_hasRealStorage() && window.storage.delete) return window.storage.delete(key, shared);
  if(_hasLocalStorage()){ window.localStorage.removeItem(LS_PREFIX+key); return; }
  delete _memoryStore[key];
}
async function storageList(prefix, shared){
  if(_hasRealStorage()) return window.storage.list(prefix, shared);
  if(_hasLocalStorage()){
    const keys = [];
    for(let i=0;i<window.localStorage.length;i++){
      const k = window.localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX+prefix)) keys.push(k.slice(LS_PREFIX.length));
    }
    return { keys };
  }
  const keys = Object.keys(_memoryStore).filter(k=>k.startsWith(prefix));
  return { keys };
}

    if(Array.isArray(arr) && arr.length) return arr;
    throw new Error('bad');
  }catch(e){
    const def = Array.from({length:DEFAULT_STOP_COUNT}, (_,i)=>'Stop '+(i+1));
    try{ await storageSet('stopnames_default', JSON.stringify(def), false); }catch(e2){}
    return def;
  }
}
async function saveDefaultStopNames(names){
  try{ await storageSet('stopnames_default', JSON.stringify(names), false); }catch(e){}
}
async function loadDay(dateStr, fallbackNames){
  try{

    const d = JSON.parse(r.value);
    const normalized = normalizeDay(d, fallbackNames);

/* ---------------- CLOUD SYNC (Firestore, best-effort layer on top of local storage) ---------------- */
/* FIREBASE_CONFIG comes from firebase-config.js, shared with admin.html */
let fbDb = null, fbAuth = null, fbUid = null, fbReady = false;

function driverIdFor(name){
  const slug = (name||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
  return slug || null;
}
function cloudConfigured(){
  return FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey.indexOf('REPLACE_ME') === -1;
}
async function initCloud(){
  if(!cloudConfigured() || typeof firebase === 'undefined') return;
  state.cloudStatus = 'connecting';
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    try{ await fbDb.enablePersistence({synchronizeTabs:true}); }catch(e){}
    await new Promise((resolve)=>{
      let settled = false;
      fbAuth.onAuthStateChanged(user=>{
        if(user && !settled){ settled = true; fbUid = user.uid; fbReady = true; resolve(); }
      });
      fbAuth.signInAnonymously().catch(()=>{ if(!settled){ settled = true; resolve(); } });
    });
  }catch(e){ fbReady = false; }
  if(!fbReady){ state.cloudStatus = 'offline'; render(); return; }
  await loadManagedMenu();
  if(state.sellerName){
    const result = await claimDriver(state.sellerName);
    state.cloudStatus = result.status;
    if(result.status === 'synced') { await hydrateFromCloud(); await loadDailyAssignment(); }
  } else {
    state.cloudStatus = 'offline';
  }
  render();
}

function isManagedMenu(value){
  return value && typeof value === 'object'
    && ['Monday','Tuesday','Wednesday','Thursday','Friday'].every(day=>value[day] && typeof value[day] === 'object');
}
function normalizeManagedMenu(value){
  if(!isManagedMenu(value)) return null;
  const normalized = {};
  for(const day of ['Monday','Tuesday','Wednesday','Thursday','Friday']){
    normalized[day] = {};
    Object.entries(value[day]).forEach(([category, items])=>{
      normalized[day][category] = Array.isArray(items) ? items.map(item=>{
        if(Array.isArray(item)) return [item[0], Number(item[1])||0];
        return [item && item.name, Number(item && item.price)||0];
      }).filter(([name])=>name) : [];
    });
  }
  return normalized;
}
async function loadManagedMenu(){
  if(!fbDb) return;
  try{
    const snap = await fbDb.collection('settings').doc('menu').get();
    const managed = normalizeManagedMenu(snap.exists && snap.data().weeklyMenu);
    if(managed) MENU = managed;
  }catch(e){ /* Use the built-in menu if settings cannot be reached. */ }
}
function assignmentForCurrentDay(){
  const assignment = state.assignment;
  if(!assignment || assignment.date !== state.date || assignment.driverId !== driverIdFor(state.sellerName)) return null;
  return Array.isArray(assignment.lines) ? assignment : null;
}
function assignmentMenu(assignment){
  if(!assignment) return null;
  const out = {};
  assignment.lines.forEach(line=>{
    if(!line || !line.name || !line.category) return;
    if(!out[line.category]) out[line.category] = [];
    out[line.category].push([line.name, Number(line.price)||0]);
  });
  return out;
}
function displayMenuForDay(weekday){
  return assignmentMenu(assignmentForCurrentDay()) || MENU[weekday];
}
function assignedQuantity(itemName){
  const assignment = assignmentForCurrentDay();
  if(!assignment) return null;
  const line = assignment.lines.find(item=>item.name === itemName);
  return line ? Math.max(0, Number(line.assigned)||0) : 0;
}
function soldTodayForItem(itemName){
  return Object.values(state.day.stops||{}).reduce((sum, stop)=>sum + ((stop.items||{})[itemName]?.sold || 0), 0);
}
function remainingAssigned(itemName){
  const assigned = assignedQuantity(itemName);
  return assigned === null ? null : Math.max(0, assigned - soldTodayForItem(itemName));
}
async function loadDailyAssignment(){
  state.assignment = null;
  const driverId = driverIdFor(state.sellerName);
  if(!fbDb || !driverId || !state.date) return;
  try{
    const monthId = 'assignments-'+state.date.slice(0,7);
    const snap = await fbDb.collection('settings').doc(monthId).get();
    const entries = snap.exists ? (snap.data().entries || {}) : {};
    state.assignment = entries[driverId+'__'+state.date] || null;
  }catch(e){ /* Offline or unavailable: continue with the regular menu. */ }
}
// Claiming is write-only (no read-before-write): a plain set()-with-merge is
// evaluated by Firestore as "create" the first time (allowed if we're setting
// ourselves as owner) or "update" every time after (allowed only if we're
// already the owner) — so a name already claimed by a different device simply
// fails the update rule and we catch that as 'taken'. This also sidesteps the
// fact that Firestore denies get() on a not-yet-existing doc under our rules.
// Returns {status:'synced', driverId} | {status:'taken'} | {status:'error', detail}
async function claimDriver(name){
  const driverId = driverIdFor(name);
  if(!driverId || !fbReady) return { status:'error', detail:'no name or not signed in' };
  try{
    await fbDb.collection('drivers').doc(driverId).set({
      name: name.trim(), ownerUid: fbUid,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    return { status:'synced', driverId };
  }catch(e){
    if(e && e.code === 'permission-denied') return { status:'taken' };
    return { status:'error', detail: (e && e.code) || String(e) };
  }
}
async function cloudPushDay(day){
  if(!fbReady || !state.sellerName) return;
  const result = await claimDriver(state.sellerName);
  state.cloudStatus = result.status;
  if(result.status !== 'synced') return;
  const driverId = result.driverId;
  try{
    await fbDb.collection('drivers').doc(driverId).collection('days').doc(day.date).set(
      Object.assign({}, day, {
        driverName: state.sellerName.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      })
    );
  }catch(e){ /* offline or blocked — local copy already saved, will retry on next edit */ }
}
async function hydrateFromCloud(){
  if(!fbReady || !state.sellerName) return;
  const driverId = driverIdFor(state.sellerName);
  if(!driverId) return;
  try{
    const snap = await fbDb.collection('drivers').doc(driverId).collection('days').get();
    let changed = false;
    for(const doc of snap.docs){
      const dateStr = doc.id;
      if(state.allDays[dateStr]) continue; // this device already has local data for that date — local wins
      const data = doc.data();
      delete data.driverName; delete data.updatedAt;
      const normalized = normalizeDay(data, state.defaultStopNames);
      await saveDay(normalized);
      state.allDays[dateStr] = normalized;
      changed = true;
    }
    if(changed && state.allDays[state.date]) state.day = state.allDays[state.date];
  }catch(e){}
}

/* ---------------- MUTATIONS ---------------- */
function priceForItem(name, weekday){
  const menu = MENU[weekday];
  if(!menu) return null;
  const found = Object.values(menu).flat().find(x=>x[0]===name);
  return found ? found[1] : null;
}
function priceForSale(name, weekday){
  const assignment = assignmentForCurrentDay();
  if(assignment){
    const line = assignment.lines.find(item=>item.name === name);
    if(line && Number.isFinite(Number(line.price))) return Number(line.price);
  }
  return priceForItem(name, weekday);
}
function bump(itemName, delta){
  const stop = state.day.stops[state.stopIndex];
  if(delta > 0){
    const remaining = remainingAssigned(itemName);
    if(remaining !== null){
      if(remaining <= 0){ toast('No more of this assigned item left.'); return; }
      delta = Math.min(delta, remaining);
    }
  }
  if(!stop.items[itemName]) stop.items[itemName] = {sold:0, price:null};
  const it = stop.items[itemName];
  it.sold = Math.max(0, it.sold + delta);
  if(it.price == null){
    const wd = effectiveWeekday(state.day);
    const p = priceForSale(itemName, wd);
    if(p != null) it.price = p;
  }
  persistDay();
}
function sellAssignedItem(itemName){
  const remaining = remainingAssigned(itemName);
  if(remaining === null){ bump(itemName, 1); return; }
  if(remaining <= 0){ toast('No more of this assigned item left.'); return; }
  const stop = state.day.stops[state.stopIndex];
  if(!stop.items[itemName]) stop.items[itemName] = {sold:0, price:null};
  const item = stop.items[itemName];
  if(item.price == null) item.price = priceForSale(itemName, effectiveWeekday(state.day)) || 0;
  item.sold += 1;
  // A new sale means the driver is ready to choose a payment, so reopen the bottom panel.
  state.paymentSheetMinimized = false;
  persistDay();
  toast('Sale logged');
}
function undoAssignedSale(itemName){
  const stop = state.day.stops[state.stopIndex];
  const item = stop.items[itemName];
  if(!item || !item.sold){ toast('There is no sale to undo.'); return; }
  item.sold = Math.max(0, item.sold - 1);
  if(item.sold === 0) delete stop.items[itemName];
  persistDay();
  toast((stop.payments||[]).length ? 'Item put back. Check the payment below.' : 'One item was put back.');
}
function setStartFloat(v){
  const n = parseFloat(v);
  state.day.startFloat = (isNaN(n) || n < 0) ? null : Math.round(n*100)/100;
  persistDay();
}
function addChangeGiven(amountStr){
  const amount = parseFloat(amountStr);
  if(isNaN(amount) || amount <= 0) return;
  const stop = state.day.stops[state.stopIndex];
  stop.cashMoves.push({ type:'change', amount: Math.round(amount*100)/100, time: nowTime() });

}
function addCashTopUp(amountStr){
  const amount = parseFloat(amountStr);
  if(isNaN(amount) || amount <= 0) return;
  const stop = state.day.stops[state.stopIndex];
  stop.cashMoves.push({ type:'topup', amount: Math.round(amount*100)/100, time: nowTime() });
  persistDay();

}
function removeCashMove(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.cashMoves.splice(idx,1);
  persistDay();
}
function r2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
function dayCashSales(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.payments||[]).forEach(p=>{ if(p.method==='Cash') t += p.amount; });
  });
  return r2(t);
}
function dayChangeGiven(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.cashMoves||[]).forEach(c=>{ if(c.type==='change') t += c.amount; });
  });
  return r2(t);
}
function dayCashTopUps(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.cashMoves||[]).forEach(c=>{ if(c.type==='topup') t += c.amount; });
  });
  return r2(t);
}
function expectedCash(day){
  const start = day.startFloat || 0;
  return r2(start + dayCashSales(day) + dayCashTopUps(day) - dayChangeGiven(day));
}
function stopChangeGiven(stop){
  return r2((stop.cashMoves||[]).reduce((s,c)=>s + (c.type==='change'?c.amount:0), 0));
}

function nowTime(){
  return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
function openVisit(stop){
  return stop.visits.find(v=>!v.depart);
}
function logArrival(){
  const stop = state.day.stops[state.stopIndex];
  if(openVisit(stop)){ toast(T('toast_already_arrived')); return; }
  stop.visits.push({ arrive: nowTime(), depart: null });
  persistDay();
  toast(T('toast_arrival'));
}
function logDeparture(){
  const stop = state.day.stops[state.stopIndex];
  const v = openVisit(stop);
  if(!v){ toast(T('toast_no_arrival')); return; }
  v.depart = nowTime();
  const canAdvance = state.stopIndex < state.day.stopNames.length - 1;
  if(canAdvance){ state.stopIndex += 1; saveStopIndex(); }
  persistDay();
  toast(canAdvance ? T('toast_departure_advance') : T('toast_departure'));
}
function removeVisit(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.visits.splice(idx,1);
  persistDay();
}
function parseTime(t){
  if(!t) return null;
  const m = t.match(/(\d+):(\d+)\s*(AM|PM)?/i);
  if(!m) return null;
  let h = parseInt(m[1],10); const min = parseInt(m[2],10);
  const ap = m[3] ? m[3].toUpperCase() : null;
  if(ap==='PM' && h!==12) h+=12;
  if(ap==='AM' && h===12) h=0;
  return h*60+min;
}
function visitMinutes(v){
  const a = parseTime(v.arrive), d = parseTime(v.depart);
  if(a===null || d===null) return null;
  let diff = d-a;
  if(diff < 0) diff += 24*60;
  return diff;
}
function fmtDur(mins){
  if(mins===null) return '—';
  if(mins < 60) return mins+'m';
  return Math.floor(mins/60)+'h '+(mins%60)+'m';
}
function dayDwellMinutes(day){
  let total = 0;
  Object.values(day.stops).forEach(st=>{
    (st.visits||[]).forEach(v=>{
      const m = visitMinutes(v);
      if(m!==null) total += m;
    });
  });
  return total;
}
function dayDriveSegments(day){
  const segs = [];
  const names = day.stopNames||[];
  for(let i=0;i<names.length-1;i++){
    const curStop = day.stops[i], nextStop = day.stops[i+1];
    if(!curStop || !nextStop) continue;
    const curVisits = curStop.visits||[], nextVisits = nextStop.visits||[];
    if(!curVisits.length || !nextVisits.length) continue;
    const lastDepart = curVisits[curVisits.length-1].depart;
    const firstArrive = nextVisits[0].arrive;
    if(!lastDepart || !firstArrive) continue;
    const a = parseTime(lastDepart), b = parseTime(firstArrive);
    if(a===null || b===null) continue;
    let diff = b-a; if(diff<0) diff += 24*60;
    segs.push({ mins:diff, fromStop:names[i], toStop:names[i+1] });
  }
  return segs;
}
function dayDriveMinutes(day){
  return dayDriveSegments(day).reduce((s,x)=>s+x.mins,0);
}
function addRequest(text){
  if(!text.trim()) return;
  const stop = state.day.stops[state.stopIndex];
  stop.requests.push(text.trim());
  persistDay();
}
function removeRequest(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.requests.splice(idx,1);
  persistDay();
}
function addPayment(amountStr){
  const amount = parseFloat(amountStr);
  if(isNaN(amount) || amount <= 0) return;
  const stop = state.day.stops[state.stopIndex];
  const method = state.activeMethod;
  const fee = method === 'Square' ? SQUARE_FEE : 0;
  const total = Math.round((amount+fee)*100)/100;
  const entry = { method, amount: total };
  if(fee > 0) entry.fee = fee;
  stop.payments.push(entry);
  persistDay();
  toast(fee>0 ? T('toast_square',{amt:fmtMoney(total)}) : T('toast_payment'));
}
function addSplitPayment(method, amountStr){
  const amount = r2(parseFloat(amountStr));
  const stop = state.day.stops[state.stopIndex];
  const remaining = r2(stopRevenue(stop) - stopCollectedTotal(stop));
  if(!amount || amount <= 0){ toast('Enter an amount first.'); return; }
  if(amount > remaining + 0.005){ toast('That is more than the amount left.'); return; }
  state.activeMethod = method;
  state.splitOpen = true;
  addPayment(amount.toFixed(2));
}
function resetSplitValues(total){
  const methods = state.splitMethods;
  if(!methods.length) return;
  const share = r2(total / methods.length);
  let assigned = 0;
  state.splitValues = {};
  methods.forEach((method, index)=>{
    const value = index === methods.length-1 ? r2(total-assigned) : share;
    state.splitValues[method] = value;
    assigned = r2(assigned+value);
  });
}
function recordSliderSplit(){
  const stop = state.day.stops[state.stopIndex];
  const due = r2(stopRevenue(stop) - stopCollectedTotal(stop));
  const entries = state.splitMethods.map(method=>({method,amount:r2(Number(state.splitValues[method])||0)})).filter(entry=>entry.amount>0);
  const total = r2(entries.reduce((sum, entry)=>sum+entry.amount,0));
  if(!entries.length){ toast('Choose at least one payment method.'); return; }
  if(total > due + 0.005){ toast('Payment is more than the amount due.'); return; }
  entries.forEach(entry=>{
    const fee = entry.method === 'Square' ? SQUARE_FEE : 0;
    const payment = { method:entry.method, amount:r2(entry.amount+fee) };
    if(fee) payment.fee = fee;
    stop.payments.push(payment);
  });
  state.splitOpen = false;
  state.splitMethods = [];
  state.splitValues = {};
  persistDay();
  toast('Payments recorded.');
}
function removePayment(idx){
  const stop = state.day.stops[state.stopIndex];
  stop.payments.splice(idx,1);
  persistDay();
}
function clearStopPayments(){
  const stop = state.day.stops[state.stopIndex];
  if(!(stop.payments||[]).length) return;
  if(!confirm('Remove all payment entries at this stop? The food sale will stay.')) return;
  stop.payments = [];
  persistDay();
  toast('All payments at this stop were removed.');
}
function bumpReturn(itemName, delta){
  if(!state.day.returns[itemName]) state.day.returns[itemName]=0;
  state.day.returns[itemName] = Math.max(0, state.day.returns[itemName]+delta);

}
function confirmAssignedReturns(){
  const assignment = assignmentForCurrentDay();
  if(!assignment) return;

    if(left > 0) returns[line.name] = left;

}
async function persistDay(){
  await saveDay(state.day);
  state.allDays[state.day.date] = state.day;
  render();
  cloudPushDay(state.day).then(render); // best-effort background sync; local save above already succeeded
}
async function renameStop(newName){
  state.day.stopNames[state.stopIndex] = newName;
  await persistDay();
}
async function setStopCount(newCount){
  newCount = Math.max(1, Math.min(30, Math.round(newCount)||1));
  const names = state.day.stopNames.slice();
  if(newCount > names.length){
    for(let i=names.length; i<newCount; i++){
      names.push('Stop '+(i+1));
      if(!state.day.stops[i]) state.day.stops[i] = makeStop();
    }
  } else if(newCount < names.length){
    names.length = newCount;
    if(state.stopIndex >= newCount){ state.stopIndex = newCount - 1; saveStopIndex(); }
  }
  state.day.stopNames = names;
  state.defaultStopNames = names.slice();
  await saveDefaultStopNames(names);
  await persistDay();
}
async function setMenuOverride(val){
  state.day.menuOverride = val || null;
  await persistDay();
}

/* ---------------- DERIVED ---------------- */
function stopItemCount(stop){
  return Object.values(stop.items||{}).reduce((s,v)=>s+(v.sold||0), 0);
}
function stopCollectedTotal(stop){
  return r2((stop.payments||[]).reduce((s,p)=>s+(p.amount-(p.fee||0)), 0));
}
function stopFeesTotal(stop){
  return r2((stop.payments||[]).reduce((s,p)=>s+(p.fee||0), 0));
}
function dayFeesTotal(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{ t += stopFeesTotal(st); });
  return r2(t);
}
const SQUARE_REAL_RATE = 0.026;
const SQUARE_REAL_FLAT = 0.10;
function dayRealSquareFee(day){
  let t = 0;
  Object.values(day.stops).forEach(st=>{
    (st.payments||[]).forEach(p=>{
      if(p.method === 'Square'){
        t += r2(p.amount * SQUARE_REAL_RATE + SQUARE_REAL_FLAT);
      }
    });
  });
  return r2(t);
}
function dayRealSquareCount(day){
  let n = 0;
  Object.values(day.stops).forEach(st=>{
    (st.payments||[]).forEach(p=>{ if(p.method === 'Square') n++; });
  });
  return n;
}
function stopUnpaid(stop, weekday){
  return r2(stopRevenue(stop) - stopCollectedTotal(stop));
}

function stopRevenue(stop){
  let total = 0;
  Object.values(stop.items||{}).forEach(it=>{
    total += (it.sold||0) * (it.price!=null ? it.price : 0);
  });
  return r2(total);
}
function dayRevenue(day){
  return r2(Object.values(day.stops).reduce((s,st)=>s+stopRevenue(st),0));
}
function dayUncollected(day){
  const wd = effectiveWeekday(day);
  let gap = 0;
  Object.values(day.stops).forEach(st=>{
    const g = stopRevenue(st) - stopCollectedTotal(st);
    if(g > 0) gap += g;
  });
  return r2(gap);
}

function computeTopSellers(weekday, n, stopName){
  const menu = MENU[weekday];
  if(!menu) return [];
  const allItems = Object.values(menu).flat();
  const menuNames = new Set(allItems.map(x=>x[0]));
  const norm = s => (s||'').trim().toLowerCase();
  const localAgg = {}, globalAgg = {};
  Object.values(state.allDays||{}).forEach(d=>{
    (d.stopNames||[]).forEach((name,i)=>{
      const st = (d.stops||{})[i];
      if(!st) return;
      Object.entries(st.items||{}).forEach(([itemName,v])=>{
        if(!menuNames.has(itemName)) return;
        const qty = v.sold||0;
        globalAgg[itemName] = (globalAgg[itemName]||0) + qty;
        if(stopName && norm(name)===norm(stopName)){
          localAgg[itemName] = (localAgg[itemName]||0) + qty;
        }
      });
    });
  });
  const rankOf = agg => Object.entries(agg).filter(([,q])=>q>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  let ranked = rankOf(localAgg);
  const localHasEnough = ranked.length >= n;
  rankOf(globalAgg).forEach(name=>{ if(!ranked.includes(name)) ranked.push(name); });
  const hotPlates = (menu['Hot Plates']||[]).map(x=>x[0]);
  hotPlates.forEach(name=>{ if(!ranked.includes(name)) ranked.push(name); });
  allItems.forEach(([name])=>{ if(!ranked.includes(name)) ranked.push(name); });
  return {
    items: ranked.slice(0,n).map(name=>allItems.find(x=>x[0]===name)).filter(Boolean),
    isLocal: localHasEnough
  };
}

function dayItemsSold(day){
  const totals = {};
  Object.values(day.stops).forEach(st=>{
    Object.entries(st.items).forEach(([name,v])=>{
      totals[name] = (totals[name]||0) + v.sold;
    });
  });
  return totals;
}
function dayPaymentTotals(day){
  const totals = {};
  PAYMENT_METHODS.forEach(m=>totals[m]=0);
  Object.values(day.stops).forEach(st=>{
    st.payments.forEach(p=>{ totals[p.method] = (totals[p.method]||0) + p.amount; });
  });
  return totals;
}
function dayVisitsList(day){
  const out = [];
  day.stopNames.forEach((name,i)=>{
    const st = day.stops[i];
    if(st) (st.visits||[]).forEach(v=>out.push({stop:name, arrive:v.arrive, depart:v.depart, mins:visitMinutes(v)}));
  });
  return out;
}

  if(!state.calOpen) return '';
  const [cy, cm] = state.calMonth.split('-').map(Number);
  const first = new Date(cy, cm-1, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(cy, cm, 0).getDate();

  for(let d=1; d<=daysInMonth; d++){

    h += '<button class="'+cls.join(' ')+'" data-date="'+ds+'">'+d+'</button>';

  h += '</div>';

    h += '<div class="cal-sel-count">'+T('cal_selected_count',{n:state.selectedDays.length,s:state.selectedDays.length===1?'':'s'})+'</div>';

      + '<button class="cal-close" id="calClose">'+T('cal_close_btn')+'</button></div>';
  }
  h += '</div></div>';
  return h;
}

const MONTH_NAMES = {
  en:["January","February","March","April","May","June","July","August","September","October","November","December"],
  es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],
  pt:["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"]
};
function monthKey(dateStr){ return dateStr.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const names = MONTH_NAMES[state.lang] || MONTH_NAMES.en;
  return names[m-1]+' '+y;
}
function groupDaysByMonth(dayList){
  const groups = {};
  dayList.forEach(d=>{
    const k = monthKey(d.date);
    if(!groups[k]) groups[k] = [];
    groups[k].push(d);
  });
  return groups;
}

function renderMonthlyCard(days){
  const groups = groupDaysByMonth(days);

  if(monthKeys.length < 1){
    return '<div class="card"><h3>'+T('monthly_title')+'</h3><div class="empty">'+T('monthly_no_data')+'</div></div>';
  }

  if(!state.selectedMonth || !monthKeys.includes(state.selectedMonth)){
    state.selectedMonth = monthKeys[0];
  }

  const monthRevenues = monthKeys.map(k=>({ key:k, rev: computeSummaryStats(groups[k]).totalRevenue }));
  const maxRev = Math.max(...monthRevenues.map(m=>m.rev), 0.01);

  let html = '<div class="card"><h3>'+T('monthly_title')+'</h3>';
  monthRevenues.forEach(({key, rev})=>{
    const isSel = key === state.selectedMonth;
    html += '<button class="bar-row month-row'+(isSel?' sel':'')+'" data-month="'+key+'">'
      + '<div class="top"><span>'+monthLabel(key)+'</span><span>'+fmtMoney(rev)+'</span></div>'
      + '<div class="bar-track"><div class="bar-fill'+(isSel?' month-sel':'')+'" style="width:'+((rev/maxRev*100).toFixed(0))+'%"></div></div>'
      + '</button>';

  html += '<div class="month-detail">'
    + '<div class="kpi-row">'
    +   '<div class="kpi"><div class="v">'+fmtMoney(monthStats.totalRevenue)+'</div><div class="k">'+T('total_revenue')+'</div></div>'
    +   '<div class="kpi gold"><div class="v">'+fmtMoney(monthStats.totalCommission)+'</div><div class="k">'+T('your_commission')+'</div></div>'
    +   '<div class="kpi warn"><div class="v">'+fmtMoney(monthStats.totalReturnedValue)+'</div><div class="k">'+T('waste_value')+'</div></div>'
    + '</div></div>';
  html += '<button class="export-btn alt" id="pickDayBtn" style="margin-top:12px;">'+T('pick_day_btn')+'</button>';
  html += '</div>';

  const selDays = (state.selectedDays||[]).slice().sort()
    .map(ds=>state.allDays[ds]).filter(Boolean);

  if(selDays.length > 0){
    const selStats = computeSummaryStats(selDays);
    html += '<div class="card"><h3>'+T('selection_title',{n:selDays.length,s:selDays.length===1?'':'s'})+'</h3>'
      + '<div class="kpi-row">'
      +   '<div class="kpi"><div class="v">'+fmtMoney(selStats.totalRevenue)+'</div><div class="k">'+T('total_revenue')+'</div></div>'
      +   '<div class="kpi gold"><div class="v">'+fmtMoney(selStats.totalCommission)+'</div><div class="k">'+T('your_commission')+'</div></div>'
      +   '<div class="kpi warn"><div class="v">'+fmtMoney(selStats.totalReturnedValue)+'</div><div class="k">'+T('waste_value')+'</div></div>'
      + '</div></div>';

    if(selDays.length > 1){
      const dailyMax = Math.max(...selDays.map(d=>dayRevenue(d)), 0.01);
      html += '<div class="card"><h3>'+T('daily_graphic_title')+'</h3>';
      selDays.forEach(d=>{
        const dStats = computeSummaryStats([d]);
        const rev = dStats.totalRevenue;
        html += '<div class="bar-row day-multi-row">'
          + '<div class="top"><span>'+fmtDateShort(d.date)+'</span><span>'+fmtMoney(rev)+'</span></div>'
          + '<div class="bar-track"><div class="bar-fill" style="width:'+((rev/dailyMax*100).toFixed(0))+'%"></div></div>'
          + '<div class="day-multi-sub">'

          +   '<span>'+T('waste_short')+': '+fmtMoney(dStats.totalReturnedValue)+'</span>'

      });

      const selMonthKeys = Object.keys(selGroups).sort();
      if(selMonthKeys.length > 1){

function computeSummaryStats(dayList){
  let totalRevenue=0, totalCommission=0, totalReturned=0, totalReturnedValue=0, totalDwell=0, totalFees=0, totalDrive=0, totalRealFee=0, totalSquareTxns=0;
  const soldAgg={}, returnedAgg={}, requestAgg={}, paymentAgg={};
  PAYMENT_METHODS.forEach(m=>paymentAgg[m]=0);

  dayList.forEach(d=>{
    const wd = effectiveWeekday(d);
    const menu = MENU[wd];
    const priceOf = name => { if(!menu) return 0; const f = Object.values(menu).flat().find(x=>x[0]===name); return f?f[1]:0; };
    const rev = dayRevenue(d);
    totalRevenue += rev;
    totalCommission += rev * COMMISSION_RATE;
    totalDwell += dayDwellMinutes(d);
    totalDrive += dayDriveMinutes(d);
    totalFees += dayFeesTotal(d);
    totalRealFee += dayRealSquareFee(d);
    totalSquareTxns += dayRealSquareCount(d);
    const sold = dayItemsSold(d);
    Object.entries(sold).forEach(([k,v])=>{ soldAgg[k]=(soldAgg[k]||0)+v; });
    Object.entries(d.returns||{}).forEach(([k,v])=>{
      returnedAgg[k]=(returnedAgg[k]||0)+v;
      totalReturned += v;
      totalReturnedValue += v * priceOf(k);
    });
    Object.values(d.stops).forEach(st=>{
      st.requests.forEach(r=>{ requestAgg[r]=(requestAgg[r]||0)+1; });
      st.payments.forEach(p=>{ paymentAgg[p.method] = (paymentAgg[p.method]||0) + p.amount; });
    });
  });

  const cashInHand = r2((paymentAgg['Cash']||0) + (paymentAgg['Zelle']||0) + (paymentAgg['Venmo']||0));
  const oweOwner = r2(cashInHand - totalCommission);

  return { totalRevenue, totalCommission, totalReturned, totalReturnedValue, totalDwell, totalFees,
    totalDrive, totalRealFee, totalSquareTxns, soldAgg, returnedAgg, requestAgg, paymentAgg,
    cashInHand, oweOwner };
}

function csvEscape(s){
  s = String(s == null ? '' : s);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function categoryForItem(name, weekday){
  const menu = MENU[weekday];
  if(!menu) return 'Other';
  for(const [cat, items] of Object.entries(menu)){
    if(items.some(x=>x[0]===name)) return cat;
  }
  return 'Other';
}
function buildDetailCSV(){
  const days = Object.values(state.allDays).sort((a,b)=>a.date<b.date?-1:1);
  const rows = [['Date','Weekday','Seller','Stop','Item','Category','UnitPrice','QtySold','LineRevenue']];
  days.forEach(d=>{
    const wd = effectiveWeekday(d);
    d.stopNames.forEach((stopName,i)=>{
      const st = d.stops[i];
      if(!st) return;
      Object.entries(st.items||{}).forEach(([name,it])=>{
        const qty = it.sold || 0;
        if(qty > 0){
          const price = it.price != null ? it.price : 0;
          const cat = categoryForItem(name, wd);
          rows.push([d.date, wd, state.sellerName||'', stopName, name, cat, price.toFixed(2), qty, (qty*price).toFixed(2)]);

    });
  });
  return 'sep=,\n' + rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}

function autoSizeCols(rows){
  const widths = rows[0].map((_,ci)=>{
    let max = 8;
    rows.forEach(r=>{
      const v = r[ci];
      const len = (v==null?'':String(v)).length;
      if(len > max) max = len;
    });
    return { wch: Math.min(max+2, 40) };
  });
  return widths;
}
function downloadXLSX(){
  try{
    if(typeof XLSX === 'undefined'){ toast(T('toast_download_fail')); return; }
    const dayRows = buildDayRowsNative();
    const detailRows = buildDetailRowsNative();

    const wb = XLSX.utils.book_new();
    const wsDay = XLSX.utils.aoa_to_sheet(dayRows);
    wsDay['!cols'] = autoSizeCols(dayRows);
    wsDay['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:dayRows.length-1,c:dayRows[0].length-1}}) };
    wsDay['!freeze'] = { xSplit:0, ySplit:1 };
    XLSX.utils.book_append_sheet(wb, wsDay, "Days");

    const wsDetail = XLSX.utils.aoa_to_sheet(detailRows);
    wsDetail['!cols'] = autoSizeCols(detailRows);
    wsDetail['!autofilter'] = { ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:detailRows.length-1,c:detailRows[0].length-1}}) };
    wsDetail['!freeze'] = { xSplit:0, ySplit:1 };
    XLSX.utils.book_append_sheet(wb, wsDetail, "Items");

    XLSX.writeFile(wb, 'route_manifest_'+todayStr()+'.xlsx');
    toast(T('toast_downloaded',{f:'Excel file'}));
  }catch(e){
    toast(T('toast_download_fail'));
  }
}

function downloadCSV(filename, text){
  try{
    const blob = new Blob([text], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    toast(T('toast_downloaded',{f:filename}));
  }catch(e){
    toast(T('toast_download_fail'));
  }
}

function buildExportText(){
  const days = Object.values(state.allDays).sort((a,b)=>a.date<b.date?-1:1);
  let out = 'ROUTE MANIFEST SUMMARY\n';
  out += 'Days logged: '+days.length+'\n\n';
  let totalRevenue=0, totalCommission=0;
  days.forEach(d=>{
    const wd = effectiveWeekday(d);
    const r = dayRevenue(d);
    totalRevenue += r;
    totalCommission += r*COMMISSION_RATE;
    out += d.date+' ('+wd+'): '+fmtMoney(r)+' revenue, '+fmtMoney(r*COMMISSION_RATE)+' commission\n';
  });
  out += '\nTOTAL REVENUE: '+fmtMoney(totalRevenue)+'\n';
  out += 'TOTAL COMMISSION (30%): '+fmtMoney(totalCommission)+'\n';
  return out;
}

function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

async function saveStopIndex(){
  try{ await storageSet('laststop:'+state.date, String(state.stopIndex), false); }catch(e){}
}
async function loadStopIndex(dateStr, maxLen){
  try{
    const r = await storageGet('laststop:'+dateStr, false);
    const idx = parseInt(r.value, 10);
    if(!isNaN(idx) && idx >= 0 && idx < maxLen) return idx;
  }catch(e){}
  return 0;
}

async function resetAllData(){
  try{
    const list = await storageList('day:', false);
    for(const k of (list.keys||[])){
      try{ await storageDelete(k, false); }
      catch(e){ try{ await storageSet(k, JSON.stringify(emptyDay(k.slice(4), state.defaultStopNames)), false); }catch(e2){} }
    }
  }catch(e){}
  state.allDays = {};
  state.date = todayStr();
  state.manualDate = false;
  state.stopIndex = 0;
  state.day = emptyDay(state.date, state.defaultStopNames);
  await saveDay(state.day);
  state.allDays[state.date] = state.day;
  state.tab = 'log';
  render();
  toast(T('toast_reset_done'));
}

async function selectDate(ds){
  state.date = ds;
  state.manualDate = (ds !== todayStr());
  state.stopIndex = 0;
  state.calOpen = false;
  state.day = await loadDay(state.date, state.defaultStopNames);
  state.allDays[state.date] = state.day;
  await loadDailyAssignment();
  render();
}

async function syncToToday(force){
  const real = todayStr();
  const genuinelyNewDay = state.sessionRealDate !== real;
  if(genuinelyNewDay) state.sessionRealDate = real;
  if(state.date === real) return false;
  if(!force && state.manualDate && !genuinelyNewDay) return false;
  state.date = real;
  state.stopIndex = 0;
  state.manualDate = false;
  state.day = await loadDay(state.date, state.defaultStopNames);
  state.allDays[state.date] = state.day;
  await loadDailyAssignment();
  render();
  return true;
}
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && state.day) syncToToday(false);
});

async function renameHistoricalItem(oldName, newName, newPrice){
  const changedDays = [];
  try{
    const list = await storageList('day:', false);
    for(const k of (list.keys||[])){
      try{
        const r = await storageGet(k, false);
        const d = JSON.parse(r.value);
        let dayChanged = false;
        Object.values(d.stops||{}).forEach(st=>{
          if(st.items && st.items[oldName]){
            const oldEntry = st.items[oldName];
            if(st.items[newName]){
              st.items[newName].sold = (st.items[newName].sold||0) + (oldEntry.sold||0);
              st.items[newName].price = newPrice;
            } else {
              st.items[newName] = { sold: oldEntry.sold||0, price: newPrice };
            }
            delete st.items[oldName];
            dayChanged = true;
          }
        });
        if(dayChanged){
          await saveDay(d);
          changedDays.push(d);
        }
      }catch(e){}
    }
  }catch(e){}
  if(changedDays.length && fbReady && state.sellerName){
    for(const d of changedDays){ try{ await cloudPushDay(d); }catch(e){} }
  }
  return changedDays;
}

async function repriceHistoricalItem(itemName, newPrice){
  const changedDays = [];
  try{
    const list = await storageList('day:', false);
    for(const k of (list.keys||[])){
      try{
        const r = await storageGet(k, false);
        const d = JSON.parse(r.value);
        let dayChanged = false;
        Object.values(d.stops||{}).forEach(st=>{
          if(st.items && st.items[itemName] && st.items[itemName].price !== newPrice){
            st.items[itemName].price = newPrice;
            dayChanged = true;
          }
        });
        if(dayChanged){
          await saveDay(d);
          changedDays.push(d);
        }
      }catch(e){}
    }
  }catch(e){}
  if(changedDays.length && fbReady && state.sellerName){
    for(const d of changedDays){ try{ await cloudPushDay(d); }catch(e){} }
  }
  return changedDays;
}

/* ---------------- INIT ---------------- */
async function init(){
  try{
    await loadPrefs();
    state.defaultStopNames = await loadDefaultStopNames();
    // One-time fresh start: clear any prior test data on first load of this build
    let fresh = false;
    try{ await storageGet('reset_v2', false); }
    catch(e){ fresh = true; }
    if(fresh){
      try{
        const list = await storageList('day:', false);
        for(const k of (list.keys||[])){
          try{ await storageDelete(k, false); }catch(e2){}
        }
      }catch(e3){}
      try{ await storageSet('reset_v2','done',false); }catch(e4){}
    }
    state.day = await loadDay(state.date, state.defaultStopNames);
    state.stopIndex = await loadStopIndex(state.date, state.day.stopNames.length);
    // Show today's route first. Older local history and cloud sync continue quietly afterward.
    state.allDays = {};
    state.allDays[state.date] = state.day;
    render();
    loadAllDays().then(async days=>{
      state.allDays = days;
      state.allDays[state.date] = state.day;
      await initCloud();
      let alreadyRepriced = false;
      try{ await storageGet('reprice_blackened_salmon_175_v1', false); alreadyRepriced = true; }
      catch(e){}
      if(!alreadyRepriced){
        const changed = await repriceHistoricalItem('Blackened Salmon', 17.5);
        try{ await storageSet('reprice_blackened_salmon_175_v1','done',false); }catch(e6){}
        if(changed.length){
          state.allDays = await loadAllDays();
          state.day = await loadDay(state.date, state.defaultStopNames);
          state.allDays[state.date] = state.day;
          render();
        }
      }
      let alreadyRenamed = false;
      try{ await storageGet('rename_capellini_to_steak_v1', false); alreadyRenamed = true; }
      catch(e){}
      if(!alreadyRenamed){
        const changed2 = await renameHistoricalItem('Shrimp Spinach Capellini', 'Steak and Mashed Potatoes', 17);
        try{ await storageSet('rename_capellini_to_steak_v1','done',false); }catch(e7){}
        if(changed2.length){
          state.allDays = await loadAllDays();
          state.day = await loadDay(state.date, state.defaultStopNames);
          state.allDays[state.date] = state.day;
          render();
        }
      }
    }); // best-effort background cloud sync + one-time historical repricing; app is already usable offline above
  }catch(err){
    document.getElementById('app').innerHTML =
      '<div style="padding:24px;font-family:sans-serif;color:#B5482E;"><h3>Something failed to load</h3>'
      + '<p style="font-size:13px;color:#333;">'+(err && err.message ? err.message : String(err))+'</p></div>';
  }
}
window.addEventListener('error', (e)=>{
  const app = document.getElementById('app');
  if(app && !app.innerHTML.trim()){
    app.innerHTML = '<div style="padding:24px;font-family:sans-serif;color:#B5482E;"><h3>Script error</h3>'
      + '<p style="font-size:13px;color:#333;">'+(e.message||'unknown')+'</p></div>';
  }
});
init();
</script>
